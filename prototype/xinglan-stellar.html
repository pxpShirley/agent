<!doctype html>
<html lang="zh-CN" class="dark" data-mode="stellar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>栖光 · 星辰星光模式 — 左侧形象页（角色在场 + 星河流转）</title>
<style>
:root[data-mode="stellar"]{
  --sky-0:#04060f; --sky-1:#070b18; --sky-2:#0a1024;
  --neb-cyan:rgba(95,225,255,.16); --neb-violet:rgba(120,150,255,.12); --neb-gold:rgba(255,196,120,.08);
  --star:#cfeeff; --star-dim:rgba(180,210,255,.55);
  --brand:#5fe1ff; --brand-bright:#8fefff; --brand-2:#7af0d4;
  --brand-glow:rgba(95,225,255,.45); --brand-glow-soft:rgba(95,225,255,.16);
  --gold:#ffd479; --gold-deep:#caa24a; --gold-glow:rgba(255,196,120,.5);
  --text:#eaf2f8; --text-2:#a7b6c6; --text-3:#8295a8;
  --border:rgba(255,255,255,.10); --surface-1:rgba(255,255,255,.06); --panel-solid:rgba(10,16,32,.74);
  --ease:cubic-bezier(.22,1,.36,1); --dur:320ms; --dur-slow:560ms; --radius:20px; --radius-sm:13px;
  --font:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);background:linear-gradient(180deg,var(--sky-0),var(--sky-1) 55%,var(--sky-2));overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:inherit}

/* background starfield */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.neb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.neb.b1{width:44vw;height:44vw;left:-12vw;top:-14vw;background:radial-gradient(circle,var(--neb-cyan),transparent 70%)}
.neb.b2{width:40vw;height:40vw;right:-10vw;bottom:-16vw;background:radial-gradient(circle,var(--neb-violet),transparent 70%)}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

/* shell */
.app{position:relative;z-index:1;display:flex;height:100vh;width:100%}

/* ===== LEFT PERSONA PAGE ===== */
.persona{width:420px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,var(--panel-solid),color-mix(in srgb,var(--panel-solid) 88%,transparent));
  backdrop-filter:blur(18px) saturate(140%);border-right:1px solid var(--border);position:relative}
.p-identity{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.p-id-left{display:flex;align-items:center;gap:11px}
.p-mark{width:30px;height:30px;flex-shrink:0}
.p-name{font-size:15px;font-weight:700;letter-spacing:.04em}
.p-state{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:7px}
.p-state .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 9px var(--brand-glow)}

.p-stage{position:relative;flex:1;min-height:0;overflow:hidden}

/* flowing star-river canvas (execution chain) */
.p-river{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* anthropomorphic character — 栖光 (retained) */
.p-being{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);
  width:min(48%,260px);aspect-ratio:1;z-index:5;transform-style:preserve-3d;transition:transform .3s var(--ease)}
.being{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 10px 38px rgba(95,225,255,.35))}
.being-body{transform-origin:100px 112px;animation:breathe 5.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.p-aura-being{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:128%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--mood,rgba(95,225,255,.34)) 0%,transparent 64%);opacity:.62;filter:blur(22px);
  transition:background .8s var(--ease);animation:auraB 7s ease-in-out infinite;z-index:4}
@keyframes auraB{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.07)}}
/* orbiting sparkles (星光环绕) */
.orbit{position:absolute;inset:-8%;z-index:6;animation:spin 30s linear infinite;pointer-events:none}
.orbit .sp{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;
  background:radial-gradient(circle,#fff,var(--brand) 60%,transparent 72%);border-radius:50%;
  box-shadow:0 0 8px var(--brand-glow);animation:twk 3.4s ease-in-out infinite}
.orbit .sp:nth-child(1){transform:rotate(0deg) translateY(-46%)}
.orbit .sp:nth-child(2){transform:rotate(120deg) translateY(-46%);animation-delay:.8s}
.orbit .sp:nth-child(3){transform:rotate(240deg) translateY(-46%);animation-delay:1.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twk{0%,100%{opacity:.35;transform:rotate(var(--r,0deg)) translateY(-46%) scale(.8)}50%{opacity:1;transform:rotate(var(--r,0deg)) translateY(-46%) scale(1.2)}}

.p-cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--text-2);z-index:8;transition:color .4s;pointer-events:none}
.p-cap b{color:var(--brand)}

/* human moment (gold, on stage) */
.human-moment{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(320px,86%);z-index:20;
  border-radius:var(--radius-sm);padding:16px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,var(--panel-solid)),var(--panel-solid));
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent),0 24px 60px -20px var(--gold-glow);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.human-moment.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.hm-tag{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-bottom:7px}
.hm-q{font-size:13.5px;line-height:1.55;color:var(--text);margin:0 0 12px}
.hm-actions{display:flex;flex-wrap:wrap;gap:7px}
.hm-btn{font-size:12px;font-weight:600;padding:8px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-2);transition:.16s}
.hm-btn:hover{color:var(--text);border-color:var(--brand)}
.hm-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;border:none}

/* detail */
.p-detail{position:absolute;left:14px;right:14px;bottom:54px;z-index:18;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--panel-solid);border:1px solid var(--border);box-shadow:0 16px 40px -20px rgba(0,0,0,.7);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.p-detail.show{opacity:1;transform:none;pointer-events:auto}
.pd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.pd-name{font-size:13px;font-weight:700;color:var(--brand-bright)}
.pd-status{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brand-glow-soft);color:var(--brand)}
.pd-tool{font-size:11px;color:var(--text-3);margin-bottom:5px}
.pd-tool b{color:var(--text-2);font-weight:600}
.pd-note{font-size:12.5px;line-height:1.55;color:var(--text-2)}

/* chain legend (text channel, kept intact) */
.p-chain{flex-shrink:0;border-top:1px solid var(--border);padding:10px 16px 14px;max-height:34%;overflow-y:auto}
.p-chain-h{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.p-chain-h::before{content:"";width:4px;height:13px;border-radius:3px;background:var(--brand)}
.p-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;cursor:pointer;transition:.16s}
.p-row:hover,.p-row.sel{background:var(--surface-1)}
.p-row .r-dot{width:9px;height:9px;border-radius:50%;background:var(--text-3);flex-shrink:0;transition:.3s}
.p-row.done .r-dot{background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}
.p-row.active .r-dot{background:var(--brand);box-shadow:0 0 10px var(--brand-glow);animation:dpulse 1.6s infinite}
.p-row.waiting .r-dot{background:var(--gold);box-shadow:0 0 10px var(--gold-glow)}
@keyframes dpulse{0%,100%{box-shadow:0 0 8px var(--brand-glow)}50%{box-shadow:0 0 16px var(--brand)}}
.p-row .r-name{font-size:12.5px;color:var(--text-2);font-weight:600;flex:1}
.p-row.active .r-name,.p-row.done .r-name{color:var(--text)}
.p-row.waiting .r-name{color:var(--gold)}
.p-row .r-tool{font-size:10.5px;color:var(--text-3)}

/* ===== RIGHT COLLAB ===== */
.collab{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 14px;flex-shrink:0}
.greet{display:flex;flex-direction:column;gap:2px}
.greet-h{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.greet-sub{font-size:12px;color:var(--text-3)}
.top-right{display:flex;align-items:center;gap:10px}
.cmdk{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-1);color:var(--text-2);font-size:12.5px;transition:.16s}
.cmdk:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.cmdk kbd{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-3)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);padding:7px 13px;border-radius:999px;background:var(--surface-1);border:1px solid var(--border)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--good,#46e0a8);box-shadow:0 0 10px var(--good,#46e0a8)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 22px 18px}
.perception{flex-shrink:0;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px rgba(0,0,0,.66);padding:13px 15px;max-height:34%}
.perception-h{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:9px}
.perception-h::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--brand)}
.p-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:150px}
.p-item{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--text-2);background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 11px;animation:rise .4s var(--ease) both}
.p-item .p-ico{font-size:14px;flex-shrink:0}
.p-item.gold{border-color:color-mix(in srgb,var(--gold) 30%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 9%,var(--panel-solid)),var(--panel-solid))}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px rgba(0,0,0,.66);overflow:hidden}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.6;animation:bloom .5s var(--ease) both}
@keyframes bloom{from{opacity:0;transform:translateY(8px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.msg.agent{align-self:flex-start;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(150,170,255,.18);border-left:2px solid var(--brand);color:var(--text)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;font-weight:500}
.typing{display:inline-flex;gap:4px;align-self:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface-1);border:1px solid var(--border)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:bounce 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.composer{flex-shrink:0;display:flex;gap:10px;padding:12px;border-top:1px solid var(--border)}
.composer input{flex:1;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13.5px;outline:none;transition:.16s}
.composer input:focus{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 3px var(--brand-glow-soft)}
.composer .send{width:42px;height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -10px var(--brand-glow)}

/* scenario bar */
.scenario{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:999px;background:var(--panel-solid);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:0 16px 40px -20px rgba(0,0,0,.7)}
.scenario .lab{font-size:11.5px;color:var(--text-3);margin-right:4px}
.scenario button{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-2);transition:.16s}
.scenario button:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.scenario button.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;border:none}

@media(max-width:980px){.persona{width:340px}.body{padding:0 14px 14px}.greet-h{font-size:18px}}
@media(max-width:680px){.app{flex-direction:column}.persona{width:100%;height:52vh;border-right:none;border-bottom:1px solid var(--border)}.collab{min-height:0}.scenario{flex-wrap:wrap;max-width:94%;justify-content:center}}
@media(prefers-reduced-motion:reduce){.being-body,.p-aura-being,.orbit,.orbit .sp{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden>
  <div class="neb b1"></div><div class="neb b2"></div>
  <canvas id="starfield"></canvas>
</div>

<div class="app">
  <!-- ===== LEFT PERSONA PAGE ===== -->
  <aside class="persona">
    <div class="p-identity">
      <div class="p-id-left">
        <svg class="p-mark" viewBox="0 0 64 64" aria-label="栖光"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6fe9ff"/><stop offset="100%" stop-color="#7af0d4"/></linearGradient></defs><g><path d="M14 40 Q32 56 50 40" fill="none" stroke="url(#og)" stroke-width="2.6" stroke-linecap="round" opacity=".75"/><circle cx="32" cy="30" r="9" fill="url(#og)"/><circle cx="32" cy="30" r="15" fill="none" stroke="url(#og)" stroke-width="1.2" opacity=".35"/></g></svg>
        <span class="p-name">栖光</span>
      </div>
      <div class="p-state"><span class="dot" id="pdot"></span><span id="pstate">在场 · 轻呼吸</span></div>
    </div>

    <div class="p-stage" id="stage">
      <!-- flowing star-river = execution chain (dynamic, no circles/lines) -->
      <canvas class="p-river" id="river"></canvas>

      <!-- anthropomorphic character (retained) -->
      <div class="p-aura-being" id="auraB"></div>
      <div class="p-being" id="being">
        <div class="orbit" aria-hidden>
          <span class="sp" style="--r:0deg"></span>
          <span class="sp" style="--r:120deg"></span>
          <span class="sp" style="--r:240deg"></span>
        </div>
        <svg class="being" viewBox="0 0 200 210" aria-label="栖光拟人形象">
          <defs>
            <radialGradient id="bodyG" cx="42%" cy="32%" r="74%">
              <stop offset="0%" stop-color="#e6f9ff"/>
              <stop offset="42%" stop-color="#86dcff"/>
              <stop offset="100%" stop-color="#3aa3e6"/>
            </radialGradient>
            <linearGradient id="tuft" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9bf0ff"/><stop offset="100%" stop-color="#ffd479"/>
            </linearGradient>
          </defs>
          <g class="being-body">
            <!-- top star tuft -->
            <path d="M100 18 L106 34 L122 32 L109 44 L116 60 L100 50 L84 60 L91 44 L78 32 L94 34 Z" fill="url(#tuft)"/>
            <!-- body -->
            <ellipse cx="100" cy="112" rx="64" ry="60" fill="url(#bodyG)"/>
            <!-- belly highlight -->
            <ellipse cx="84" cy="92" rx="26" ry="20" fill="rgba(255,255,255,.38)"/>
            <!-- eyes -->
            <ellipse cx="80" cy="104" rx="13" ry="15" fill="#fff"/>
            <ellipse cx="120" cy="104" rx="13" ry="15" fill="#fff"/>
            <circle class="pupil" id="pupL" cx="80" cy="107" r="7.6" fill="#16314a"/>
            <circle class="pupil" id="pupR" cx="120" cy="107" r="7.6" fill="#16314a"/>
            <circle cx="83.5" cy="103.5" r="2.4" fill="#fff"/>
            <circle cx="123.5" cy="103.5" r="2.4" fill="#fff"/>
            <!-- blush -->
            <ellipse cx="62" cy="126" rx="10" ry="6" fill="rgba(255,150,175,.4)"/>
            <ellipse cx="138" cy="126" rx="10" ry="6" fill="rgba(255,150,175,.4)"/>
            <!-- smile -->
            <path d="M86 130 Q100 143 114 130" fill="none" stroke="#16314a" stroke-width="3.4" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="p-cap" id="cap">栖光在场 · 轻呼吸</div>

      <div class="p-detail" id="detail">
        <div class="pd-head"><span class="pd-name" id="pdName">步骤</span><span class="pd-status" id="pdStatus">待运行</span></div>
        <div class="pd-tool" id="pdTool"></div>
        <div class="pd-note" id="pdNote"></div>
      </div>

      <div class="human-moment" id="human">
        <div class="hm-tag">人的时刻 · 由你定</div>
        <p class="hm-q" id="hmQ">这两家民宿，你更偏向有山景的那间吗？</p>
        <div class="hm-actions">
          <button class="hm-btn primary" data-d="confirm">就这间 ✓</button>
          <button class="hm-btn" data-d="escalate">想再看看别的</button>
          <button class="hm-btn" data-d="defer">晚点再说</button>
          <button class="hm-btn" data-d="cancel">先不安排</button>
        </div>
      </div>
    </div>

    <div class="p-chain">
      <div class="p-chain-h">执行链 · 栖光的思考轨迹（星河流转）</div>
      <div id="legend"></div>
    </div>
  </aside>

  <!-- ===== RIGHT COLLAB ===== -->
  <main class="collab">
    <header class="top">
      <div class="greet">
        <h1 class="greet-h">与栖光一起</h1>
        <span class="greet-sub">星辰星光模式下，左侧是栖光本人，环绕她的是正在流转的思考星河</span>
      </div>
      <div class="top-right">
        <button class="cmdk" title="唤起能力 ⌘K"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>能力<kbd>⌘K</kbd></button>
        <div class="status"><span class="dot"></span>在线</div>
      </div>
    </header>
    <div class="body">
      <section class="perception">
        <div class="perception-h">栖光的轻声 · 感知流</div>
        <div class="p-list" id="perception">
          <div class="p-item"><span class="p-ico">🌅</span><span>早安。今天天气晴，适合把昨晚说的周边游走一走。</span></div>
        </div>
      </section>
      <section class="chat">
        <div class="chat-scroll" id="chat">
          <div class="msg agent">我在。左侧是栖光本人——她的周围，正绕着一条随思考流转的星河。试试下方演示。</div>
        </div>
        <div class="composer">
          <input id="inp" placeholder="对栖光说点什么…（Enter 发送）" />
          <button class="send" id="send">➤</button>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="scenario">
  <span class="lab">演示：</span>
  <button id="runB" class="primary">▶ 运行执行链</button>
  <button id="senseB">主动感知</button>
  <button id="loopB">情感闭环</button>
  <button id="resetB">重置</button>
</div>

<script>
/* ===== starfield (stellar) ===== */
(function(){
  var c=document.getElementById('starfield');var ctx=c.getContext('2d');var stars=[];var raf=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){c.width=innerWidth;c.height=innerHeight;var total=Math.min(170,Math.floor(c.width*c.height/10000));
    stars=[];for(var i=0;i<total;i++){stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:.3+Math.random()*1.8,a:.18+Math.random()*.6,s:.005+Math.random()*.03,sw:Math.random()*6.28,d:Math.random()});}}
  resize();addEventListener('resize',resize);
  function render(t){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<stars.length;i++){var p=stars[i];
    if(!reduce){p.y-=p.s;p.x+=Math.sin(t*.0004+p.sw)*.12*p.d;if(p.y<-2){p.y=c.height+2;p.x=Math.random()*c.width;}}
    var tw=reduce?1:(.75+Math.sin(t*.001+p.sw*3)*.25);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+(p.d>.6?200:175)+','+(p.d>.6?220:195)+',255,'+(p.a*tw)+')';ctx.fill();}}
  function loop(){render(performance.now());raf=requestAnimationFrame(loop);}
  if(reduce){render(0);}else{loop();}
})();

/* ===== Execution Chain — single source of truth ===== */
var STEPS=[
  {id:'intake', x:30,y:84, label:'理解意图', tool:'意图识别',        note:'用户想规划本周末的周边游，偏好自然、轻松。', cap:'栖光在理解你的意图'},
  {id:'recall', x:16,y:60, label:'召回记忆', tool:'memory.search',   note:'查到：你偏爱山景与温泉，上次于西山溪谷住过、评价很好。', cap:'栖光在召回你的记忆'},
  {id:'assess', x:20,y:34, label:'评估条件', tool:'weather.get · maps.route', note:'周六晴，西山车程 1.5h、路况通畅，适宜出行。', cap:'栖光在评估出行条件'},
  {id:'draft',  x:42,y:16, label:'起草方案', tool:'itinerary.compose', note:'生成草案：周六溪谷民宿+温泉，周日晨间徒步。', cap:'栖光在起草方案'},
  {id:'review', x:66,y:16, label:'复核偏好', tool:'preference.check', note:'对照偏好：山景✓ 温泉✓ 预算≤800✓，通过。', cap:'栖光在复核你的偏好'},
  {id:'handoff',x:86,y:40, label:'交还决策', tool:'ask_user',        note:'人的时刻：两间民宿由你定，栖光把选择权交还。', cap:'栖光把决定权交给你', waiting:true},
  {id:'settle', x:78,y:80, label:'安住待命', tool:'—',               note:'方案就绪，栖光退居后台轻呼吸，等你回应。', cap:'方案就绪 · 栖光轻呼吸'}
];
var CHAT={
  intake:'🧭 理解意图：你想规划本周末的周边游，偏好自然、轻松。',
  recall:'💡 召回记忆：你偏爱山景与温泉，上次于西山溪谷住过、评价很好。',
  assess:'🌤 评估条件：周六晴，西山车程 1.5h、路况通畅，适宜出行。',
  draft:'📝 起草方案：生成草案——周六溪谷民宿+温泉，周日晨间徒步。',
  review:'✅ 复核偏好：山景✓ 温泉✓ 预算≤800✓，通过。',
  settle:'🌟 方案就绪，我退到一旁轻呼吸，你定就好。'
};

var legend=document.getElementById('legend');
var statusMap={};

function stepById(id){for(var i=0;i<STEPS.length;i++){if(STEPS[i].id===id)return STEPS[i];}return null;}
function stepIndex(id){for(var i=0;i<STEPS.length;i++){if(STEPS[i].id===id)return i;}return -1;}
function isLit(id){var s=statusMap[id];return s==='done'||s==='active'||s==='waiting';}
function litProgress(){var lit=0;for(var i=0;i<STEPS.length;i++){if(isLit(STEPS[i].id))lit++;}return lit/STEPS.length;}

/* ===== flowing star-river (canvas) ===== */
var rc=document.getElementById('river');var rctx=rc.getContext('2d');
var DPR=Math.min(2,window.devicePixelRatio||1);
var W=0,H=0,path=[],knotPos={},particles=[],comets=[];
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function catmull(P,seg){
  var out=[];
  for(var i=0;i<P.length-1;i++){
    var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    for(var j=0;j<seg;j++){
      var t=j/seg,t2=t*t,t3=t2*t;
      var x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      var y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      out.push({x:x,y:y});
    }
  }
  out.push(P[P.length-1]);return out;
}
function sampleAt(t){var f=t*(path.length-1);var i=Math.floor(f);var fr=f-i;
  var a=path[i],b=path[Math.min(i+1,path.length-1)];return {x:a.x+(b.x-a.x)*fr,y:a.y+(b.y-a.y)*fr};}

function buildRiver(){
  var st=document.getElementById('stage').getBoundingClientRect();
  W=st.width;H=st.height;
  rc.width=Math.floor(W*DPR);rc.height=Math.floor(H*DPR);
  rc.style.width=W+'px';rc.style.height=H+'px';
  rctx.setTransform(DPR,0,0,DPR,0,0);
  var pts=STEPS.map(function(s){return {x:s.x/100*W,y:s.y/100*H};});
  path=catmull(pts,24);
  STEPS.forEach(function(s){knotPos[s.id]={x:s.x/100*W,y:s.y/100*H};});
  if(particles.length===0){for(var i=0;i<96;i++){particles.push({t:Math.random(),spd:0.012+Math.random()*0.03,size:0.7+Math.random()*1.9,ph:Math.random()*6.28,br:0.4+Math.random()*0.6});}}
}
addEventListener('resize',buildRiver);

function spawnComet(fromT,toT,gold){if(reduce)return;comets.push({from:fromT,to:toT,t:0,gold:gold});}

function renderRiver(time){
  rctx.clearRect(0,0,W,H);
  rctx.globalCompositeOperation='lighter';
  var prog=litProgress();
  // flowing particles (星河流转)
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    if(!reduce){p.t+=p.spd*0.0016;if(p.t>1)p.t-=1;}
    var pos=sampleAt(p.t);
    var litHere=p.t<=prog;
    var tw=reduce?1:(0.6+0.4*Math.sin(time*0.003+p.ph));
    var a=(litHere?0.95:0.22)*p.br*tw;
    var r=(litHere?p.size*1.5:p.size);
    var glow=litHere?'95,225,255':'150,190,255';
    var g=rctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,r*4.2);
    g.addColorStop(0,'rgba('+glow+','+a+')');g.addColorStop(1,'rgba('+glow+',0)');
    rctx.fillStyle=g;rctx.beginPath();rctx.arc(pos.x,pos.y,r*4.2,0,6.28);rctx.fill();
    rctx.fillStyle='rgba('+(litHere?'228,246,255':'182,206,255')+','+(a*1.1)+')';
    rctx.beginPath();rctx.arc(pos.x,pos.y,r*0.5,0,6.28);rctx.fill();
  }
  // knots (soft luminous blooms, not circles+lines)
  var tNow=time*0.004;
  for(var k=0;k<STEPS.length;k++){
    var s=STEPS[k];var kp=knotPos[s.id];var st=statusMap[s.id]||'pending';
    var pulse=reduce?1:(0.82+0.18*Math.sin(tNow+(s.x+s.y)*0.1));
    var baseR,alpha,col;
    if(st==='waiting'){col='255,196,120';baseR=15;alpha=0.92*pulse;}
    else if(st==='active'){col='150,239,255';baseR=14;alpha=0.95*pulse;}
    else if(st==='done'){col='95,225,255';baseR=10;alpha=0.72}
    else {col='150,190,255';baseR=6;alpha=0.26}
    var g2=rctx.createRadialGradient(kp.x,kp.y,0,kp.x,kp.y,baseR*3.6);
    g2.addColorStop(0,'rgba('+col+','+alpha+')');
    g2.addColorStop(0.5,'rgba('+col+','+(alpha*0.5)+')');
    g2.addColorStop(1,'rgba('+col+',0)');
    rctx.fillStyle=g2;rctx.beginPath();rctx.arc(kp.x,kp.y,baseR*3.6,0,6.28);rctx.fill();
    rctx.fillStyle='rgba(242,251,255,'+(alpha*0.9)+')';
    rctx.beginPath();rctx.arc(kp.x,kp.y,baseR*0.4,0,6.28);rctx.fill();
  }
  // comets (light pulses traveling along the river)
  for(var c=comets.length-1;c>=0;c--){
    var cm=comets[c];if(!reduce)cm.t+=0.04;
    if(cm.t>=1){comets.splice(c,1);continue;}
    var tt=cm.from+(cm.to-cm.from)*cm.t;
    var head=sampleAt(tt);
    var cc=cm.gold?'255,210,140':'180,245,255';
    for(var tr=0;tr<7;tr++){
      var tp=cm.from+(cm.to-cm.from)*Math.max(0,cm.t-tr*0.03);
      var pp=sampleAt(tp);var ta=(1-tr/7)*(0.9-cm.t*0.3);
      var cg=rctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,7);
      cg.addColorStop(0,'rgba('+cc+','+ta+')');cg.addColorStop(1,'rgba('+cc+',0)');
      rctx.fillStyle=cg;rctx.beginPath();rctx.arc(pp.x,pp.y,7,0,6.28);rctx.fill();
    }
  }
  rctx.globalCompositeOperation='source-over';
  requestAnimationFrame(renderRiver);
}
buildRiver();requestAnimationFrame(renderRiver);

/* ===== build legend (text channel) ===== */
function build(){
  STEPS.forEach(function(s){
    statusMap[s.id]='pending';
    var row=document.createElement('div');
    row.className='p-row';row.dataset.id=s.id;
    row.innerHTML='<span class="r-dot"></span><span class="r-name">'+s.label+'</span><span class="r-tool">'+s.tool+'</span>';
    row.addEventListener('click',function(){inspect(s.id);});
    legend.appendChild(row);
  });
}

function setStatus(id,st){
  statusMap[id]=st;
  var row=legend.querySelector('.p-row[data-id="'+id+'"]');if(row)row.className='p-row '+st;
}
function updateLegend(){}

/* character aura (mood) */
var auraB=document.getElementById('auraB');
var AURA={calm:'rgba(95,225,255,.34)',run:'rgba(111,214,255,.48)',waiting:'rgba(255,196,120,.44)',concerned:'rgba(140,160,210,.36)',sleep:'rgba(120,140,180,.24)'};
function setAura(mode){auraB.style.background='radial-gradient(circle,'+(AURA[mode]||AURA.calm)+' 0%, transparent 64%)';}

var cap=document.getElementById('cap');
var pstate=document.getElementById('pstate');
function setCap(text){cap.innerHTML=text.replace('栖光','<b>栖光</b>');}
function setState(t){pstate.textContent=t;}

/* detail */
var detail=document.getElementById('detail');
var pdName=document.getElementById('pdName'),pdStatus=document.getElementById('pdStatus'),pdTool=document.getElementById('pdTool'),pdNote=document.getElementById('pdNote');
function inspect(id){var s=stepById(id);var st=statusMap[id]||'pending';
  pdName.textContent=s.label;pdStatus.textContent=(st==='waiting'?'人的时刻':st==='done'?'已完成':st==='active'?'进行中':'待运行');
  pdTool.innerHTML='工具：<b>'+s.tool+'</b>';pdNote.textContent=s.note;
  detail.classList.add('show');
  var rows=legend.querySelectorAll('.p-row');for(var i=0;i<rows.length;i++)rows[i].classList.toggle('sel',rows[i].dataset.id===id);}

/* chat + perception */
var chat=document.getElementById('chat');var perception=document.getElementById('perception');
function addMsg(role,text){var d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addPerception(icon,text,gold){var d=document.createElement('div');d.className='p-item'+(gold?' gold':'');d.innerHTML='<span class="p-ico">'+icon+'</span><span>'+text+'</span>';perception.appendChild(d);perception.scrollTop=perception.scrollHeight;}

/* ===== chain runner ===== */
function activate(id){
  var idx=stepIndex(id);
  for(var i=0;i<idx;i++){var ps=STEPS[i];if(statusMap[ps.id]!=='done')setStatus(ps.id,'done');}
  var st=stepById(id).waiting?'waiting':'active';
  setStatus(id,st);
  if(idx>0){var prev=STEPS[idx-1];spawnComet((idx-1)/(STEPS.length-1),idx/(STEPS.length-1),st==='waiting');}
  var s=stepById(id);
  setCap(s.cap);
  if(st==='waiting'){setState('把决定权交给你');setAura('waiting');}
  else if(st==='active'){setState('正在为你思考');setAura('run');}
  if(id!=='handoff'&&CHAT[id])addMsg('agent',CHAT[id]);
  if(st==='waiting')showHuman();
}

var human=document.getElementById('human');
function showHuman(){human.classList.add('show');}
function hideHuman(){human.classList.remove('show');}

var hmBtns=human.querySelectorAll('.hm-btn');
for(var h=0;h<hmBtns.length;h++){hmBtns[h].onclick=function(){var d=this.dataset.d;hideHuman();
  setStatus('handoff','done');
  if(d==='confirm'){addMsg('me','就这间 ✓');addMsg('agent','好嘞，山景房记下啦，周末愉快～');}
  else if(d==='escalate'){addMsg('me','想再看看别的');addMsg('agent','没问题，我再找几家不一样的给你挑。');}
  else if(d==='defer'){addPerception('⏰','你稍后想看民宿，我记下，到时再提醒你。',true);addMsg('me','晚点再说');addMsg('agent','好，晚点我再轻轻碰你一下。');}
  else{addMsg('me','先不安排');addMsg('agent','行，那先放一边。');}
  setStatus('settle','active');setStatus('settle','done');setAura('calm');setState('在场 · 轻呼吸');setCap('方案就绪 · 栖光轻呼吸');
  addMsg('agent',CHAT.settle);};}

/* timers */
var timers=[];function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function later(ms,fn){timers.push(setTimeout(fn,ms));}
var STEP_MS=950;

function reset(){
  clearTimers();comets=[];
  STEPS.forEach(function(s){setStatus(s.id,'pending');});
  chat.innerHTML='<div class="msg agent">我在。左侧是栖光本人——她的周围，正绕着一条随思考流转的星河。试试下方演示。</div>';
  perception.innerHTML='<div class="p-item"><span class="p-ico">🌅</span><span>早安。今天天气晴，适合把昨晚说的周边游走一走。</span></div>';
  detail.classList.remove('show');legend.querySelectorAll('.p-row').forEach(function(r){r.classList.remove('sel');});
  hideHuman();setAura('calm');setState('在场 · 轻呼吸');setCap('栖光在场 · 轻呼吸');
}

/* scenarios */
document.getElementById('runB').onclick=function(){reset();
  var order=['intake','recall','assess','draft','review','handoff'];
  order.forEach(function(id,i){later(i*STEP_MS,function(){activate(id);});});};
document.getElementById('senseB').onclick=function(){reset();
  setStatus('intake','done');setStatus('recall','active');spawnComet(0,1/6,false);
  setAura('concerned');setState('有点担心你');setCap('栖光注意到你的作息');
  addPerception('💗','栖光注意到：你连续三晚睡得偏晚。',true);
  addMsg('agent','我看了下你的作息，这几天都快一点才睡。今晚要不要我帮你把明早的闹钟调晚些，空出点睡眠？');};
document.getElementById('loopB').onclick=function(){reset();
  STEPS.forEach(function(s){if(s.id!=='handoff')setStatus(s.id,'done');});
  setAura('calm');setState('很开心');setCap('栖光很开心');
  addMsg('agent','周末的行程都安排妥当啦，山景房也订好了 🎉');
  later(1600,function(){addPerception('🌟','栖光：今天和你一起规划真的很开心。');});
  later(3000,function(){setAura('sleep');setState('安睡中');setCap('栖光安睡中…');
    addMsg('agent','(栖光轻轻打了个哈欠) 我去歇会儿啦，有事随时叫我。');});};
document.getElementById('resetB').onclick=reset;

/* composer */
var inp=document.getElementById('inp');var send=document.getElementById('send');
function userSend(){var t=inp.value.trim();if(!t)return;addMsg('me',t);inp.value='';
  var ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;
  setTimeout(function(){ty.remove();addMsg('agent','好，我来帮你。先让我想想最合适的做法——你看左侧，星河正一圈圈亮起来。');
    reset();setStatus('intake','done');setStatus('recall','active');spawnComet(0,1/6,false);setAura('run');setState('正在思考');setCap('栖光在召回记忆');},1100);}
send.onclick=userSend;inp.addEventListener('keydown',function(e){if(e.key==='Enter')userSend();});

/* character: eyes follow cursor + subtle parallax (reduced-motion safe) */
var pupL=document.getElementById('pupL'),pupR=document.getElementById('pupR'),being=document.getElementById('being');
function eyeFollow(cx,cy){
  var r=document.getElementById('stage').getBoundingClientRect();
  var bx=being.getBoundingClientRect();
  var ccx=bx.left+bx.width/2, ccy=bx.top+bx.height/2;
  var dx=Math.max(-1,Math.min(1,(cx-ccx)/(r.width/2)));
  var dy=Math.max(-1,Math.min(1,(cy-ccy)/(r.height/2)));
  var ox=dx*5.2, oy=dy*5.2;
  pupL.setAttribute('transform','translate('+ox+','+oy+')');
  pupR.setAttribute('transform','translate('+ox+','+oy+')');
}
if(!reduce){
  addEventListener('mousemove',function(e){eyeFollow(e.clientX,e.clientY);});
  var stage=document.getElementById('stage');
  stage.addEventListener('mousemove',function(e){var r=stage.getBoundingClientRect();
    var dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
    being.style.transform='translate(-50%,-50%) rotateY('+(dx*5)+'deg) rotateX('+(-dy*5)+'deg)';});
  stage.addEventListener('mouseleave',function(){being.style.transform='translate(-50%,-50%)';});
}

build();reset();
</script>
