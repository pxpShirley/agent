<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060a11" />
<title>栖光 · 拟光 — 未来 Agent 交互原型 v2.3</title>
<style>
:root{
  --brand:#5fe1ff; --brand-2:#7af0d4; --brand-soft:rgba(95,225,255,.10); --brand-glow:rgba(95,225,255,.45);
  --gold:#f6c062; --gold-soft:rgba(246,192,98,.12); --gold-glow:rgba(246,192,98,.42);
  --app-bg:#060a11; --text:#eaf2f8; --text-2:#a7b6c6; --text-3:#8ea2b8;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.05); --surface-1:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.10); --panel-solid:rgba(15,21,31,.72);
  --good:#46e0a8; --bad:#ff7a7a; --info:#6fa8ff;
  --shadow-soft:rgba(0,0,0,.66);
  --ease:cubic-bezier(.22,1,.36,1); --dur-fast:160ms; --dur:320ms; --dur-slow:560ms;
  --radius:20px; --radius-sm:13px; --radius-xs:10px;
  --font:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mood:rgba(95,225,255,.42);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--app-bg);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:inherit}

/* ============ 滚动条 ============ */
.chat-scroll::-webkit-scrollbar,.p-list::-webkit-scrollbar,.cmk-list::-webkit-scrollbar,.tabpane::-webkit-scrollbar,.gov-list::-webkit-scrollbar,.sess-grid::-webkit-scrollbar{width:5px;height:5px}
.chat-scroll::-webkit-scrollbar-thumb,.p-list::-webkit-scrollbar-thumb,.cmk-list::-webkit-scrollbar-thumb,.tabpane::-webkit-scrollbar-thumb,.gov-list::-webkit-scrollbar-thumb,.sess-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.chat-scroll::-webkit-scrollbar-thumb:hover,.tabpane::-webkit-scrollbar-thumb:hover,.gov-list::-webkit-scrollbar-thumb:hover{background:rgba(95,225,255,.3)}
.chat-scroll,.p-list,.cmk-list,.tabpane,.gov-list,.sess-grid{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}

/* ============ 背景 ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.neb-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 28s ease-in-out infinite alternate}
.neb-blob.b1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 40%,transparent),transparent 70%)}
.neb-blob.b2{width:40vw;height:40vw;right:-8vw;top:-6vw;background:radial-gradient(circle,color-mix(in srgb,var(--brand-2) 38%,transparent),transparent 70%);animation-duration:36s;animation-direction:alternate-reverse}
.neb-blob.b3{width:50vw;height:50vw;left:30vw;bottom:-24vw;background:radial-gradient(circle,rgba(120,150,255,.28),transparent 70%);animation-duration:46s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(3.5vw,2.5vw) scale(1.07)}}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 40%,transparent 55%,rgba(0,0,0,.5))}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ============ 骨架 ============ */
.app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh;width:100%}

/* ---- Rail ---- */
.rail{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--panel-solid),color-mix(in srgb,var(--panel-solid) 86%,transparent));
  backdrop-filter:blur(18px) saturate(140%);border-right:1px solid var(--border);z-index:5}
.rail-brand{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0 16px;width:100%}
.rail-brand svg{filter:drop-shadow(0 0 12px var(--brand-glow))}
.rail-name{font-size:12px;font-weight:700;letter-spacing:.14em}
.rail-nav{display:flex;flex-direction:column;gap:7px;width:100%;flex:1}
.rail-btn{appearance:none;position:relative;border:1px solid transparent;background:transparent;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:56px;padding:11px 4px;border-radius:14px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.rail-btn svg{width:21px;height:21px}
.rail-btn:hover{color:var(--text);background:var(--panel);transform:translateY(-1px)}
.rail-btn:active{transform:translateY(0) scale(.97)}
.rail-btn.active{color:var(--brand);background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent);box-shadow:0 0 18px -6px var(--brand-glow)}
.rail-btn.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:24px;border-radius:2px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));box-shadow:0 0 10px var(--brand-glow)}
.rail-foot{display:flex;flex-direction:column;gap:6px;width:100%;padding-top:12px;border-top:1px solid var(--border)}

/* ---- 顶栏 ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px 16px;flex-shrink:0}
.greet{display:flex;flex-direction:column;gap:4px;min-width:0}
.greet-h{font-size:clamp(18px,2.2vw,24px);font-weight:700;letter-spacing:-.015em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet-sub{font-size:12.5px;color:var(--text-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cmdk{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 13px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface-1);color:var(--text-2);font-size:12.5px;font-weight:500;transition:.16s var(--ease)}
.cmdk:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.cmdk kbd{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-3);font-family:inherit}
.status{display:inline-flex;align-items:center;gap:8px;min-height:38px;font-size:12px;color:var(--text-2);font-weight:500;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:dotp 2.6s ease-in-out infinite}
@keyframes dotp{0%,100%{box-shadow:0 0 0 0 rgba(70,224,168,.45)}50%{box-shadow:0 0 0 6px rgba(70,224,168,0)}}

/* ---- 舞台 ---- */
.stage-body{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:0 22px 18px}
.presence{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;border-radius:var(--radius);overflow:hidden}
.presence::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 46%,color-mix(in srgb,var(--mood) 22%,transparent),transparent 70%);transition:background .8s var(--ease)}
.presence::after{content:"";position:absolute;inset:0;background:rgba(3,6,14,.52);opacity:0;transition:opacity .45s var(--ease);pointer-events:none;z-index:19}
.presence.hm-open::after{opacity:1}
.stage-cap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);max-width:92%;
  display:inline-flex;align-items:center;gap:7px;padding:7px 18px;border-radius:999px;
  background:color-mix(in srgb,var(--panel-solid) 90%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--border);font-size:12.5px;letter-spacing:.03em;color:var(--text-2);z-index:3;white-space:nowrap;transition:color .4s,border-color .4s}
.stage-cap b{color:var(--brand);font-weight:600}
.aura{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(440px,80%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--mood) 0%,transparent 66%);opacity:.55;filter:blur(26px);animation:aura 7s ease-in-out infinite;transition:background .8s}
@keyframes aura{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.42}50%{transform:translate(-50%,-50%) scale(1.12);opacity:.6}}
.ripple{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;border:1px solid var(--brand);opacity:0}
.ripple.on{animation:rip 1.9s ease-out}
@keyframes rip{from{opacity:.5;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}

/* ---- 栖光（悬浮 + 呼吸 + 投影） ---- */
.mochi-wrap{position:relative;width:min(230px,50%);aspect-ratio:1/1.05;z-index:2;cursor:pointer;transition:transform var(--dur-slow) var(--ease)}
.mochi-wrap.waiting{transform:translateY(10px) scale(1.04)}
.mochi-wrap.happy{animation:hop .6s var(--ease)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.mochi-wrap.breath{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.mochi-wrap.speaking{animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.mochi-wrap.sleeping{filter:saturate(.7) brightness(.92)}
.mochi-float{width:100%;height:100%;animation:floaty 5.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.mochi-shadow{position:absolute;left:50%;bottom:1%;width:54%;height:6%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.42),transparent 70%);filter:blur(2px);
  animation:shpulse 5.2s ease-in-out infinite;pointer-events:none}
@keyframes shpulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(.86);opacity:.6}}
.mochi-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.4))}
.ss-star-tw{animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
.ss-mote1{animation:moteA 6.5s ease-in-out infinite}
.ss-mote2{animation:moteB 8s ease-in-out infinite}
.ss-mote3{animation:moteA 7.4s ease-in-out infinite reverse}
@keyframes moteA{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(6px,-9px);opacity:.95}}
@keyframes moteB{0%,100%{transform:translate(0,0);opacity:.75}50%{transform:translate(-7px,7px);opacity:.4}}
.ss-eye-arc,.ss-eye-closed,.ss-brow,.ss-mouth-grin,.ss-mouth-sad,.ss-mouth-small,.ss-think{opacity:0;transition:opacity .3s}
.ss-eyeball{transition:opacity .3s}
.mochi-wrap[data-mood=thinking] .ss-brow,.mochi-wrap[data-mood=thinking] .ss-think{opacity:1}
.mochi-wrap[data-mood=thinking] .ss-mouth{opacity:0}
.mochi-wrap[data-mood=thinking] .ss-mouth-small{opacity:1}
.mochi-wrap[data-mood=speaking] .ss-eyeball{opacity:0}
.mochi-wrap[data-mood=speaking] .ss-eye-arc{opacity:1}
.mochi-wrap[data-mood=happy] .ss-eyeball{opacity:0}
.mochi-wrap[data-mood=happy] .ss-eye-arc{opacity:1}
.mochi-wrap[data-mood=happy] .ss-mouth{opacity:0}
.mochi-wrap[data-mood=happy] .ss-mouth-grin{opacity:1}
.mochi-wrap[data-mood=concerned] .ss-brow{opacity:1}
.mochi-wrap[data-mood=concerned] .ss-mouth{opacity:0}
.mochi-wrap[data-mood=concerned] .ss-mouth-sad{opacity:1}
.mochi-wrap[data-mood=waiting] .ss-eyeball{opacity:0}
.mochi-wrap[data-mood=waiting] .ss-eye-arc{opacity:1}
.mochi-wrap[data-mood=sleeping] .ss-eyeball{opacity:0}
.mochi-wrap[data-mood=sleeping] .ss-eye-closed{opacity:1}
.mochi-wrap[data-mood=sleeping] .ss-mouth{opacity:0}
.mochi-wrap[data-mood=sleeping] .ss-mouth-small{opacity:1}

/* ---- 执行链 · 星轨 ---- */
.orbit-wrap{position:absolute;inset:0;z-index:1;pointer-events:none}
.orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.o-base{fill:none;stroke:rgba(160,200,255,.20);stroke-width:1;stroke-dasharray:2 7;stroke-linecap:round;opacity:.55}
.o-seg{fill:none;stroke:url(#osegGrad);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s var(--ease)}
.orb-node{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
.orb-node.up{flex-direction:column-reverse}
.orb-dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--brand) 62%);
  box-shadow:0 0 10px rgba(95,225,255,.45);opacity:.35;transition:opacity .4s var(--ease),box-shadow .4s var(--ease),transform .4s var(--ease)}
.orb-lab{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--text-3);padding:2px 10px;border-radius:99px;
  background:rgba(8,14,30,.55);backdrop-filter:blur(4px);border:1px solid transparent;transition:.4s var(--ease);white-space:nowrap}
.orb-node.on .orb-dot{opacity:1;transform:scale(1.2);box-shadow:0 0 16px var(--brand-glow)}
.orb-node.on .orb-lab{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 32%,transparent);background:color-mix(in srgb,var(--brand) 10%,rgba(8,14,30,.62))}
.orb-node.on::after{content:"";position:absolute;top:0;left:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);
  border:1px solid var(--brand);animation:orbring 2.2s ease-out infinite;pointer-events:none}
.orb-node.up.on::after{top:auto;bottom:0;transform:translate(-50%,50%)}
@keyframes orbring{from{opacity:.9;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(3)}}
.orb-node.up.on::after{from{opacity:.9;transform:translate(-50%,50%) scale(1)}to{opacity:0;transform:translate(-50%,50%) scale(3)}}

/* ============ 右栏 · 多视图 ============ */
.side{display:flex;flex-direction:column;min-height:0}
.side-view{display:none;flex-direction:column;min-height:0;flex:1;gap:14px}
.side-view.on{display:flex;animation:vfade .34s var(--ease)}
@keyframes vfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 视图头 + Tabs */
.sv-head{display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.sv-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--text-2)}
.sv-title::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}
.tabs{display:flex;gap:7px;margin-left:auto}
.tabs button{min-height:34px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-3);border:1px solid var(--border);background:var(--surface-1);transition:.16s var(--ease)}
.tabs button:hover{color:var(--text);border-color:var(--border-strong)}
.tabs button.on{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}
.sv-sub{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--text-2);margin-bottom:11px;flex-shrink:0}
.sv-sub::before{content:"";width:4px;height:13px;border-radius:3px;background:var(--brand)}
.sv-sub.gold::before{background:var(--gold);box-shadow:0 0 8px var(--gold-glow)}

/* ---- home：感知流 + 对话 ---- */
.perception{flex-shrink:0;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px var(--shadow-soft);padding:15px 16px;max-height:38%}
.perception-h{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--text-2);margin-bottom:11px}
.perception-h::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}
.p-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:210px;padding-right:2px}
.p-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.65;color:var(--text-2);background:var(--surface-1);border:1px solid var(--border);border-radius:11px;padding:10px 12px;animation:rise .4s var(--ease) both;transition:border-color .2s var(--ease)}
.p-item:hover{border-color:var(--border-strong)}
.p-item .p-ico{font-size:14px;flex-shrink:0;line-height:1.5}
.p-item.gold{border-color:color-mix(in srgb,var(--gold) 30%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 9%,var(--panel-solid)),var(--panel-solid))}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px var(--shadow-soft);overflow:hidden}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.72;animation:bloom .5s var(--ease) both;word-break:break-word}
@keyframes bloom{from{opacity:0;transform:translateY(8px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.msg.agent{align-self:flex-start;border-radius:16px 16px 16px 6px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(150,170,255,.18);border-left:2px solid var(--brand);color:var(--text)}
.msg.me{align-self:flex-end;border-radius:16px 16px 6px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;font-weight:500;border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 24px -12px var(--brand-glow)}
.typing{display:inline-flex;gap:4px;align-self:flex-start;padding:13px 15px;border-radius:16px 16px 16px 6px;background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--brand)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:bounce 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

.composer{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--panel-solid) 60%,transparent)}
.composer input{flex:1;min-width:0;min-height:44px;background:var(--surface-1);border:1px solid var(--border);border-radius:999px;padding:11px 18px;color:var(--text);font-size:14px;outline:none;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.composer input::placeholder{color:var(--text-3)}
.composer input:focus{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface-2)}
.composer .send{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -10px var(--brand-glow);transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .18s var(--ease)}
.composer .send:not(.idle):hover{transform:translateY(-1px) scale(1.05);box-shadow:0 14px 26px -10px var(--brand-glow)}
.composer .send:active{transform:scale(.94)}
.composer .send.idle{opacity:.38;pointer-events:none;box-shadow:none}

/* ---- mine：灵境 ---- */
.tabpane{display:none;flex:1;min-height:0;overflow-y:auto;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px var(--shadow-soft);padding:15px}
.tabpane.on{display:block}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;align-content:start}
.kcard{padding:14px 16px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border);font-size:13px;line-height:1.65;transition:border-color .2s var(--ease),transform .2s var(--ease);animation:rise .4s var(--ease) both}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.kcard .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--brand);margin-bottom:5px}
.kcard .k .ktag{font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);background:var(--brand-soft);letter-spacing:.04em}
.kcard .v{color:var(--text)}
.kcard .meta{margin-top:7px;font-size:11px;color:var(--text-3)}
.kcard .art-ico{font-size:22px;margin-bottom:8px;line-height:1}
.goal{padding:13px 16px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border);margin-bottom:10px;transition:border-color .2s var(--ease)}
.goal:hover{border-color:var(--border-strong)}
.goal .g-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:9px;gap:10px}
.goal .g-top b{font-weight:600}
.goal .g-top span{font-size:11.5px;color:var(--text-3);flex-shrink:0}
.goal .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.goal .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 45%,transparent),var(--gold));box-shadow:0 0 10px var(--gold-glow);transition:width 1.1s var(--ease)}
.mv-empty{grid-column:1/-1;padding:26px;text-align:center;color:var(--text-3);font-size:12.5px;border:1px dashed var(--border);border-radius:13px}

/* ---- gov：治理 ---- */
.gov-sec{display:flex;flex-direction:column;min-height:0}
.gov-sec.grow{flex:1}
.gov-card{background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px -24px var(--shadow-soft);padding:15px 16px;display:flex;flex-direction:column;min-height:0}
.gov-list{overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px}
.gov-row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:13px;background:var(--surface-1);border:1px solid var(--border);font-size:13px;line-height:1.6;animation:rise .4s var(--ease) both;transition:opacity .3s var(--ease),transform .3s var(--ease),border-color .2s var(--ease)}
.gov-row:hover{border-color:var(--border-strong)}
.gov-row.bye{opacity:0;transform:translateX(12px)}
.gov-row .g-main{flex:1;min-width:0}
.gov-row b{font-weight:600}
.gov-row .g-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.gov-row .tag{flex-shrink:0;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);color:var(--brand);background:var(--brand-soft)}
.gov-row .tag.gold{border-color:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--gold);background:var(--gold-soft)}
.gov-row .forget{flex-shrink:0;min-height:32px;padding:5px 12px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--text-3);border:1px solid var(--border);background:transparent;transition:.16s var(--ease)}
.gov-row .forget:hover{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 7%,transparent)}
.gov-row .forget:active{transform:scale(.95)}
.gov-empty{padding:22px;border-radius:13px;border:1px dashed var(--border);color:var(--text-3);font-size:12.5px;text-align:center;line-height:1.7}

/* ---- hist：历史（侧面板视图） ---- */
.sess-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;align-content:start}
.sess{text-align:left;width:100%;padding:13px 15px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border);transition:border-color .2s var(--ease),transform .2s var(--ease),opacity .3s var(--ease);animation:rise .4s var(--ease) both}
.sess:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.sess.cur{border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}
.sess.bye{opacity:0;transform:translateX(12px)}
.sess .s-t{font-size:13.5px;font-weight:600;color:var(--text)}
.sess .s-m{font-size:11.5px;color:var(--text-3);margin-top:3px}
.sess .s-x{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.sess .s-tag{font-size:10.5px;letter-spacing:.06em;color:var(--brand)}
.sess .s-tag.done{color:var(--text-3)}
.sess .s-del{font-size:11px;min-height:26px;padding:3px 9px;border-radius:8px;color:var(--text-3);border:1px solid transparent;background:transparent;transition:.15s var(--ease)}
.sess .s-del:hover{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.new-chat-btn{min-height:34px;padding:7px 15px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);border:1px solid var(--border);background:var(--surface-1);transition:.16s var(--ease)}
.new-chat-btn:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}

/* ---- 人的时刻 ---- */
.human-moment{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(430px,92%);z-index:20;
  border-radius:18px;padding:22px 22px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,var(--panel-solid)),var(--panel-solid));
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent),0 24px 60px -20px var(--gold-glow);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.human-moment.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.hm-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-bottom:10px}
.hm-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold-glow);animation:ppulse 1.3s infinite}
@keyframes ppulse{0%,100%{opacity:1}50%{opacity:.4}}
.hm-q{font-size:15.5px;line-height:1.65;color:var(--text);margin:0 0 16px;font-weight:500}
.hm-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hm-btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text-2);transition:.16s var(--ease)}
.hm-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px)}
.hm-btn:active{transform:scale(.97)}
.hm-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;border:none;box-shadow:0 8px 20px -10px var(--brand-glow)}
.hm-btn.primary:hover{color:#04141a;filter:brightness(1.08)}
.hm-btn.ghost{opacity:.75}

/* ---- ⌘K ---- */
.cmk-mask{position:fixed;inset:0;z-index:60;background:rgba(2,3,10,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.cmk-mask.show{opacity:1;pointer-events:auto}
.cmk{position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-10px) scale(.98);width:min(560px,92%);z-index:61;
  background:var(--panel-solid);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--border-strong);border-radius:16px;
  box-shadow:0 30px 70px -28px var(--shadow-soft),0 0 0 1px rgba(95,225,255,.06);overflow:hidden;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.cmk.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.cmk-input{width:100%;padding:16px 18px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:15px;outline:none}
.cmk-input::placeholder{color:var(--text-3)}
.cmk-list{max-height:330px;overflow-y:auto;padding:8px}
.cmk-group{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.08em;padding:10px 12px 6px}
.cmk-item{appearance:none;width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text-2);font-size:13.5px;text-align:left;cursor:pointer;transition:background .12s}
.cmk-item .ci-ico{width:27px;height:27px;border-radius:8px;background:var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .12s}
.cmk-item.sel{background:var(--brand-soft);color:var(--text)}
.cmk-item.sel .ci-ico{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.cmk-empty{padding:26px;text-align:center;color:var(--text-3);font-size:13px}
.cmk-foot{display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.cmk-foot kbd{font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-right:4px;font-family:inherit}

/* ---- 演示条 ---- */
.scenario{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);
  padding:9px 12px;border-radius:999px;background:var(--panel-solid);backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--border);box-shadow:0 16px 40px -20px rgba(0,0,0,.7)}
.scenario .lab{font-size:11.5px;color:var(--text-3);margin-right:4px;flex-shrink:0}
.scenario button{font-size:12.5px;font-weight:600;min-height:36px;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-2);transition:.16s var(--ease);white-space:nowrap}
.scenario button:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.scenario button:active{transform:scale(.96)}
.scenario button.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04141a;border:none;box-shadow:0 8px 20px -10px var(--brand-glow)}

/* ---- 响应式 ---- */
@media(max-width:980px){
  .stage-body{grid-template-columns:1fr;grid-template-rows:minmax(300px,46vh) minmax(0,1fr);gap:14px;padding:0 14px calc(76px + env(safe-area-inset-bottom))}
  .perception{max-height:none}
  .p-list{max-height:110px}
  .presence{min-height:300px}
  .scenario{left:12px;right:12px;transform:none;width:auto;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .scenario::-webkit-scrollbar{display:none}
  .scenario .lab{display:none}
  .top{padding:16px 16px 12px}
  .cmdk .cmdk-t{display:none}
}
@media(max-width:560px){
  .rail{width:62px;padding:16px 8px calc(12px + env(safe-area-inset-bottom))}
  .rail-name{display:none}
  .rail-btn{min-height:48px;font-size:10px;gap:3px}
  .rail-btn.active::before{left:-8px}
  .greet-h{font-size:18px}
  .greet-sub{font-size:11.5px}
  .stage-body{padding:0 10px calc(72px + env(safe-area-inset-bottom))}
  .human-moment{padding:18px 16px 14px}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1;padding:7px 8px}
}
@media(pointer:coarse){
  .composer input{font-size:16px}
  .rail-btn,.hm-btn,.scenario button,.cmdk{min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="neb-blob b1"></div><div class="neb-blob b2"></div><div class="neb-blob b3"></div>
  <div class="vignette"></div>
  <canvas id="starfield"></canvas>
</div>

<div class="app">
  <aside class="rail" aria-label="主导航">
    <div class="rail-brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6fe9ff"/><stop offset="100%" stop-color="#7af0d4"/></linearGradient></defs><g filter="url(#og)"><path d="M14 40 Q32 56 50 40" fill="none" stroke="url(#og)" stroke-width="2.6" stroke-linecap="round" opacity=".75"/><circle cx="32" cy="30" r="9" fill="url(#og)"/><circle cx="32" cy="30" r="15" fill="none" stroke="url(#og)" stroke-width="1.2" opacity=".35"/></g></svg>
      <span class="rail-name">栖光</span>
    </div>
    <nav class="rail-nav">
      <button class="rail-btn active" data-view="home" title="主页·对话·在场" aria-label="主页" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg><span class="rb-label">主页</span></button>
      <button class="rail-btn" data-view="mine" title="我的·灵境" aria-label="我的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span class="rb-label">我的</span></button>
      <button class="rail-btn" data-view="hist" title="历史会话" aria-label="历史"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="rb-label">历史</span></button>
      <button class="rail-btn" data-view="gov" title="治理与设置" aria-label="治理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="rb-label">治理</span></button>
    </nav>
    <div class="rail-foot">
      <button class="rail-btn" title="切换配色" aria-label="切换配色" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17c-2 0-3-1.5-3-3 0-1.5 1-2 1-3 0-1.5-1-2-1-3 0-1.5 1-2 3-2z"/></svg><span class="rb-label">青蓝</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="greet">
        <h1 class="greet-h" id="greet">我在，随时听你吩咐</h1>
        <span class="greet-sub">栖光 · 栖息于你设备里的光之生灵</span>
      </div>
      <div class="top-right">
        <button class="cmdk" id="cmdkBtn" title="唤起能力 ⌘K" aria-label="唤起能力"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><span class="cmdk-t">唤起能力</span><kbd>⌘K</kbd></button>
        <div class="status" role="status"><span class="dot" aria-hidden="true"></span>在线</div>
      </div>
    </header>

    <div class="stage-body">
      <section class="presence" id="presence" aria-label="栖光在场舞台">
        <div class="aura" aria-hidden="true"></div>

        <!-- 执行链 · 星轨（环绕栖光的轨道） -->
        <div class="orbit-wrap" id="orbitWrap" aria-hidden="true">
          <svg class="orbit-svg" id="orbitSvg">
            <defs>
              <linearGradient id="osegGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5fe1ff" stop-opacity=".95"/>
                <stop offset="100%" stop-color="#7af0d4" stop-opacity=".95"/>
              </linearGradient>
            </defs>
            <ellipse class="o-base" id="orbitBase"/>
            <path class="o-seg" id="oseg0"/>
            <path class="o-seg" id="oseg1"/>
            <path class="o-seg" id="oseg2"/>
            <path class="o-seg" id="oseg3"/>
          </svg>
          <div class="orb-node up" id="orb0"><span class="orb-lab">规划</span><span class="orb-dot"></span></div>
          <div class="orb-node up" id="orb1"><span class="orb-lab">检索</span><span class="orb-dot"></span></div>
          <div class="orb-node" id="orb2"><span class="orb-lab">执行</span><span class="orb-dot"></span></div>
          <div class="orb-node" id="orb3"><span class="orb-lab">复核</span><span class="orb-dot"></span></div>
        </div>

        <div class="ripple" id="ripple" aria-hidden="true"></div>

        <!-- 栖光：悬浮 + 呼吸 + 地面投影 -->
        <div class="mochi-wrap breath" id="mochi" data-mood="calm" title="栖光" role="img" aria-label="栖光，光之生灵">
          <div class="mochi-shadow" aria-hidden="true"></div>
          <div class="mochi-float">
            <svg class="mochi-svg" viewBox="0 0 200 210" aria-hidden="true">
              <defs>
                <radialGradient id="mg" cx="44%" cy="28%" r="86%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="28%" stop-color="#eefaff"/>
                  <stop offset="64%" stop-color="#bfe8ff"/>
                  <stop offset="100%" stop-color="rgba(95,208,255,.38)"/>
                </radialGradient>
                <radialGradient id="mb" cx="50%" cy="40%" r="58%">
                  <stop offset="0%" stop-color="rgba(255,255,255,.9)"/>
                  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <linearGradient id="mrim" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="rgba(255,255,255,.85)"/>
                  <stop offset="55%" stop-color="rgba(190,232,255,.28)"/>
                  <stop offset="100%" stop-color="rgba(95,208,255,.5)"/>
                </linearGradient>
              </defs>
              <ellipse class="ss-foot" cx="72" cy="190" rx="16" ry="9" fill="url(#mrim)"/>
              <ellipse class="ss-foot" cx="128" cy="190" rx="16" ry="9" fill="url(#mrim)"/>
              <path class="ss-body" d="M100 26 C150 26 175 64 175 108 C175 153 150 192 100 196 C50 192 25 153 25 108 C25 64 50 26 100 26 Z"
                fill="url(#mg)" stroke="url(#mrim)" stroke-width="1.4"/>
              <ellipse cx="100" cy="116" rx="44" ry="52" fill="url(#mb)" opacity=".55"/>
              <ellipse class="ss-halo" cx="78" cy="72" rx="30" ry="17" fill="rgba(255,255,255,.5)" opacity=".45" transform="rotate(-18 78 72)"/>
              <ellipse class="ss-cheek" cx="58" cy="118" rx="12" ry="7.5" fill="rgba(255,160,170,.45)"/>
              <ellipse class="ss-cheek" cx="142" cy="118" rx="12" ry="7.5" fill="rgba(255,160,170,.45)"/>
              <g class="ss-eyes" id="eyes">
                <g class="ss-eye"><ellipse class="ss-eyeball" cx="80" cy="100" rx="9.2" ry="12" fill="#2a3a4a"/><circle cx="83.4" cy="95" r="3.4" fill="#fff"/><circle cx="77" cy="104" r="1.7" fill="rgba(255,255,255,.75)"/><path class="ss-eye-arc" d="M70 101 Q80 92 90 101" fill="none" stroke="#2a3a4a" stroke-width="3" stroke-linecap="round"/><path class="ss-eye-closed" d="M70 104 Q80 110 90 104" fill="none" stroke="#2a3a4a" stroke-width="3" stroke-linecap="round"/></g>
                <g class="ss-eye"><ellipse class="ss-eyeball" cx="120" cy="100" rx="9.2" ry="12" fill="#2a3a4a"/><circle cx="123.4" cy="95" r="3.4" fill="#fff"/><circle cx="117" cy="104" r="1.7" fill="rgba(255,255,255,.75)"/><path class="ss-eye-arc" d="M110 101 Q120 92 130 101" fill="none" stroke="#2a3a4a" stroke-width="3" stroke-linecap="round"/><path class="ss-eye-closed" d="M110 104 Q120 110 130 104" fill="none" stroke="#2a3a4a" stroke-width="3" stroke-linecap="round"/></g>
              </g>
              <path class="ss-brow" d="M68 88 Q80 83 92 88" fill="none" stroke="#9fb6c8" stroke-width="2.4" stroke-linecap="round"/>
              <path class="ss-brow" d="M108 88 Q120 83 132 88" fill="none" stroke="#9fb6c8" stroke-width="2.4" stroke-linecap="round"/>
              <path class="ss-mouth" d="M92 118 Q100 125 108 118" fill="none" stroke="#2a3a4a" stroke-width="3" stroke-linecap="round"/>

<script>
/* starfield */
(function(){
  var c=document.getElementById('starfield');var ctx=c.getContext('2d');var stars=[];var raf=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){c.width=innerWidth;c.height=innerHeight;var total=Math.min(150,Math.floor(c.width*c.height/11000));
    stars=[];for(var i=0;i<total;i++){stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:.3+Math.random()*1.7,a:.18+Math.random()*.6,s:.006+Math.random()*.03,sw:Math.random()*6.28,d:Math.random()});}}
  resize();addEventListener('resize',resize);
  function render(t){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<stars.length;i++){var p=stars[i];if(!reduce){p.y-=p.s;p.x+=Math.sin(t*.0004+p.sw)*.12*p.d;if(p.y<-2){p.y=c.height+2;p.x=Math.random()*c.width;}}
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+(p.d>.6?190:160)+','+(p.d>.6?215:180)+',255,'+p.a+')';ctx.fill();}}
  function loop(){render(performance.now());raf=requestAnimationFrame(loop);}
  if(reduce){render(0);}else{loop();}
})();

/* eye follow */
(function(){
  var eyes=document.getElementById('eyes');var wrap=document.querySelector('.mochi-wrap');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  addEventListener('mousemove',function(e){var r=wrap.getBoundingClientRect();var cx=r.left+r.width/2;var cy=r.top+r.height/2;
    var dx=Math.max(-3,Math.min(3,(e.clientX-cx)/42));var dy=Math.max(-2.4,Math.min(2.4,(e.clientY-cy)/50));
    eyes.style.transform='translate('+dx+'px,'+dy+'px)';});
})();

/* state machine */
var mochi=document.getElementById('mochi');
var cap=document.getElementById('cap');
var aura=document.querySelector('.aura');
var presence=document.getElementById('presence');
var MOODS={
  calm:{m:'rgba(95,225,255,.42)',cap:'栖光在场 · 轻呼吸',wrap:'breath'},
  listening:{m:'rgba(111,214,255,.5)',cap:'栖光在听你说话',wrap:'breath'},
  thinking:{m:'rgba(111,214,255,.55)',cap:'栖光在思考…',wrap:'breath'},
  speaking:{m:'rgba(190,240,255,.6)',cap:'栖光正在说',wrap:'speaking'},
  waiting:{m:'rgba(246,192,98,.55)',cap:'栖光把决定权交给你',wrap:''},
  happy:{m:'rgba(126,224,212,.6)',cap:'栖光很开心',wrap:'happy'},
  concerned:{m:'rgba(140,160,200,.5)',cap:'栖光有点担心你',wrap:'breath'},
  sleeping:{m:'rgba(120,140,180,.4)',cap:'栖光安睡中…',wrap:'sleeping'}
};
function setMood(name){var s=MOODS[name]||MOODS.calm;mochi.dataset.mood=name;cap.innerHTML=s.cap.replace('栖光','<b>栖光</b>');
  aura.style.background='radial-gradient(circle, '+s.m+' 0%, transparent 66%)';
  mochi.className='mochi-wrap '+(s.wrap||'');
  if(name==='waiting'){mochi.classList.add('waiting');}}
function ripple(){var r=document.getElementById('ripple');r.classList.remove('on');void r.offsetWidth;r.classList.add('on');}

/* ============ 执行链 · 星轨 ============ */
var ORB_ANGLES=[238,325,55,142]; /* y-down 度数：左上→右上→右下→左下，顺时针流转 */
var ORB_ON=[false,false,false,false];
function layoutOrbit(){
  var r=presence.getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  var cx=r.width/2, cy=r.height*0.44;
  var rx=Math.min(r.width*0.36,255), ry=Math.min(r.height*0.27,145);
  var base=document.getElementById('orbitBase');
  base.setAttribute('cx',cx);base.setAttribute('cy',cy);
  base.setAttribute('rx',rx);base.setAttribute('ry',ry);
  var pts=[];
  for(var i=0;i<4;i++){
    var rad=ORB_ANGLES[i]*Math.PI/180;
    var x=cx+rx*Math.cos(rad), y=cy+ry*Math.sin(rad);
    pts.push([x,y]);
    var n=document.getElementById('orb'+i);
    if(n){
      n.style.left=x+'px';n.style.top=y+'px';
      n.classList.toggle('up',Math.sin(rad)<0);
    }
  }
  for(var s=0;s<4;s++){
    var a=pts[s], b=pts[(s+1)%4];
    var seg=document.getElementById('oseg'+s);
    seg.setAttribute('d','M '+a[0].toFixed(1)+' '+a[1].toFixed(1)+' A '+rx+' '+ry+' 0 0 1 '+b[0].toFixed(1)+' '+b[1].toFixed(1));
    seg.setAttribute('pathLength','1');
    /* seg s 连接节点 s→s+1：顺序流转时点亮「到达弧」 */
    var lit=(s<3)?(ORB_ON[s]&&ORB_ON[s+1]):false;
    seg.style.strokeDashoffset=lit?'0':'1';
  }
}
function setNode(i,on){
  ORB_ON[i]=on;
  var n=document.getElementById('orb'+i);
  if(n)n.classList.toggle('on',on);
  if(on){
    if(i>0&&ORB_ON[i-1]){var s=document.getElementById('oseg'+(i-1));if(s)s.style.strokeDashoffset='0';}
  }else{
    for(var k=0;k<4;k++){
      var sg=document.getElementById('oseg'+k);
      if(sg)sg.style.strokeDashoffset='1';
    }
  }
}
addEventListener('resize',layoutOrbit);

/* chat + perception */
var chat=document.getElementById('chat');var perception=document.getElementById('perception');
function nowTime(){var d=new Date();var h=d.getHours();var m=d.getMinutes();return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function addMsg(role,text){var d=document.createElement('div');d.className='msg '+role;d.textContent=text;d.title=nowTime();chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addPerception(icon,text,gold){var d=document.createElement('div');d.className='p-item'+(gold?' gold':'');d.innerHTML='<span class="p-ico" aria-hidden="true">'+icon+'</span><span>'+text+'</span>';perception.appendChild(d);perception.scrollTop=perception.scrollHeight;}
function typing(){var d=document.createElement('div');d.className='typing';d.setAttribute('aria-label','栖光正在输入');d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}

/* input */
var inp=document.getElementById('inp');var send=document.getElementById('send');
function syncSend(){send.classList.toggle('idle',!inp.value.trim());}
inp.addEventListener('input',syncSend);
function userSend(){var t=inp.value.trim();if(!t)return;addMsg('me',t);inp.value='';syncSend();setMood('listening');setTimeout(function(){setMood('thinking');},300);
  var ty=typing();setTimeout(function(){ty.remove();setMood('speaking');addMsg('agent','好，我来帮你。先让我想想最合适的做法。');setTimeout(function(){setMood('calm');},1400);},1100);}
send.onclick=userSend;inp.addEventListener('keydown',function(e){if(e.key==='Enter')userSend();});

/* human moment + 决策留痕 */
var human=document.getElementById('human');
var DT={confirm:'同意 · 按此执行',escalate:'调整 · 再看细节',defer:'稍后 · 晚点再定',cancel:'取消 · 先不安排'};
function logDecision(q,d){
  var box=document.getElementById('govLog');
  var emp=box.querySelector('.gov-empty');if(emp)emp.remove();
  var row=document.createElement('div');row.className='gov-row';
  row.innerHTML='<div class="g-main"><b>'+q.slice(0,22)+(q.length>22?'…':'')+'</b><div class="g-sub">'+nowTime()+' · 协作场景「交还」</div></div><span class="tag gold">'+d+'</span>';
  box.insertBefore(row,box.firstChild);
}
function showHuman(q){document.getElementById('hm-q').textContent=q;human.classList.add('show');presence.classList.add('hm-open');setMood('waiting');
  setTimeout(function(){var p=human.querySelector('.hm-btn.primary');if(p)p.focus();},120);}
function hideHuman(){human.classList.remove('show');presence.classList.remove('hm-open');setMood('calm');}
var hmBtns=human.querySelectorAll('.hm-btn');
for(var h=0;h<hmBtns.length;h++){hmBtns[h].onclick=function(){var b=this;var q=document.getElementById('hm-q').textContent;hideHuman();addMsg('me',b.textContent);var d=b.dataset.d;
  logDecision(q,DT[d]||d);
  if(d==='confirm'){setMood('happy');addMsg('agent','好嘞，就这间山景房，我已经记下啦。');}
  else if(d==='escalate'){setMood('thinking');addMsg('agent','没问题，我再找几家不一样的给你挑。');setTimeout(function(){setMood('calm');},1200);}
  else if(d==='defer'){addPerception('⏰','你稍后想看民宿，我记下了，到时再提醒你。',true);setMood('calm');addMsg('agent','好，晚点我再轻轻碰你一下。');}
  else{setMood('calm');addMsg('agent','行，那先放一边。');}};}

/* command palette */
var cmk=document.getElementById('cmk');var cmkMask=document.getElementById('cmkMask');var cmkInput=document.getElementById('cmkInput');var cmkList=document.getElementById('cmkList');
var CMK=[
  {g:'能力',items:[{ico:'🧭',t:'帮我规划周末周边游'},{ico:'💗',t:'记一下我妈生日快到了'},{ico:'🌿',t:'今晚有什么放松建议'},{ico:'📊',t:'帮我做个本周复盘'}]},
  {g:'记忆',items:[{ico:'📌',t:'打开「妈妈生日」记忆'},{ico:'🎯',t:'查看进行中的目标'}]},
  {g:'历史',items:[{ico:'💬',t:'继续昨天的旅行规划'},{ico:'🔁',t:'重看上周的复盘'}]}
];
var cmkSel=0;var cmkFlat=[];
function renderCmk(q){q=(q||'').toLowerCase();cmkList.innerHTML='';cmkFlat=[];var empty=true;
  CMK.forEach(function(grp){var its=grp.items.filter(function(it){return it.t.toLowerCase().indexOf(q)>=0;});
    if(its.length===0)return;empty=false;
    var gh=document.createElement('div');gh.className='cmk-group';gh.textContent=grp.g;cmkList.appendChild(gh);
    its.forEach(function(it){var idx=cmkFlat.length;cmkFlat.push(it.t);
      var el=document.createElement('button');el.type='button';el.className='cmk-item'+(idx===cmkSel?' sel':'');
      el.innerHTML='<span class="ci-ico" aria-hidden="true">'+it.ico+'</span><span>'+it.t+'</span>';
      el.onmouseenter=function(){cmkSel=idx;syncSel();};
      el.onclick=function(){runCmk(it.t);};
      cmkList.appendChild(el);});});
  if(empty){var e=document.createElement('div');e.className='cmk-empty';e.textContent='没有匹配的能力、记忆或历史';cmkList.appendChild(e);}
  syncSel();}
function syncSel(){var els=cmkList.querySelectorAll('.cmk-item');for(var i=0;i<els.length;i++){els[i].classList.toggle('sel',i===cmkSel);}}
function openCmk(){cmk.classList.add('show');cmkMask.classList.add('show');cmkInput.value='';cmkSel=0;renderCmk('');setTimeout(function(){cmkInput.focus();},30);}
function closeCmk(){cmk.classList.remove('show');cmkMask.classList.remove('show');}
function runCmk(t){closeCmk();inp.value=t;syncSend();userSend();}
document.getElementById('cmdkBtn').onclick=openCmk;cmkMask.onclick=closeCmk;
cmkInput.addEventListener('input',function(){cmkSel=0;renderCmk(cmkInput.value);});
cmkInput.addEventListener('keydown',function(e){var n=cmkFlat.length;if(n===0&&e.key!=='Escape')return;
  if(e.key==='ArrowDown'){cmkSel=(cmkSel+1)%n;syncSel();e.preventDefault();}
  else if(e.key==='ArrowUp'){cmkSel=(cmkSel-1+n)%n;syncSel();e.preventDefault();}
  else if(e.key==='Enter'){if(cmkFlat[cmkSel])runCmk(cmkFlat[cmkSel]);}
  else if(e.key==='Escape'){closeCmk();}});

/* scenarios */
var timers=[];function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function later(ms,fn){timers.push(setTimeout(fn,ms));}
function reset(){clearTimers();chat.innerHTML='<div class="msg agent">我在。想聊点什么，或让我帮你留意点什么？</div>';
  perception.innerHTML='<div class="p-item"><span class="p-ico" aria-hidden="true">🌅</span><span>早安。今天天气晴，适合把昨晚说的周边游走一走。</span></div><div class="p-item"><span class="p-ico" aria-hidden="true">⏰</span><span>你妈生日还有 5 天，要现在记一笔提醒吗？</span></div>';
  setMood('calm');hideHuman();for(var i=0;i<4;i++){setNode(i,false);}}

document.getElementById('reset').onclick=function(){reset();};
document.getElementById('playB').onclick=function(){reset();setView('home');
  addMsg('me','帮我规划这个周末的周边游');later(400,function(){setMood('listening');});
  later(900,function(){setMood('thinking');setNode(0,true);addPerception('🧭','栖光正在为你规划路线…');});
  later(1700,function(){setNode(1,true);});
  later(2400,function(){setNode(2,true);var ty=typing();later(900,function(){ty.remove();setMood('speaking');addMsg('agent','我查了天气和交通：周六晴，推荐去西山脚下的溪谷民宿，车程 1.5h，还能顺路泡温泉。');});});
  later(4200,function(){setNode(3,true);});
  later(4800,function(){setMood('calm');addMsg('agent','不过订哪间，得你定——');showHuman('这两家民宿，你更偏向有山景的那间吗？');});
};
document.getElementById('playC').onclick=function(){reset();setView('home');setMood('calm');
  later(500,function(){ripple();addPerception('💗','栖光注意到：你连续三晚睡得偏晚。',true);});
  later(1600,function(){setMood('concerned');addMsg('agent','我看了下你的作息，这几天都快一点才睡。今晚要不要我帮你把明早的闹钟调晚些，空出点睡眠？');});
  later(3200,function(){setMood('calm');});
};
document.getElementById('playE').onclick=function(){reset();setView('home');setMood('calm');
  later(400,function(){setMood('happy');addMsg('agent','周末的行程都安排妥当啦，山景房也订好了 🎉');});
  later(1600,function(){ripple();addPerception('🌟','栖光：今天和你一起规划真的很开心。');});
  later(3000,function(){setMood('sleeping');addMsg('agent','(栖光轻轻打了个哈欠) 我去歇会儿啦，有事随时叫我。');});
};

/* ============ 视图切换（主页 / 我的 / 历史 / 治理） ============ */
function setView(name){
  var btns=document.querySelectorAll('.rail-nav .rail-btn[data-view]');
  btns.forEach(function(b){
    var on=b.getAttribute('data-view')===name;
    b.classList.toggle('active',on);
    if(on){b.setAttribute('aria-current','page');}else{b.removeAttribute('aria-current');}
  });
  document.querySelectorAll('.side-view').forEach(function(s){s.classList.remove('on');});
  var t=document.getElementById('sv-'+name);if(t)t.classList.add('on');
  if(name==='mine')later(80,animateGoals);
}
document.querySelectorAll('.rail-nav .rail-btn[data-view]').forEach(function(b){
  b.onclick=function(){setView(b.getAttribute('data-view'));};
});

/* Tabs */
var tabBtns=document.querySelectorAll('#sv-mine .tabs button[data-tab]');
tabBtns.forEach(function(b){
  b.onclick=function(){
    tabBtns.forEach(function(x){x.classList.remove('on');x.setAttribute('aria-selected','false');});
    b.classList.add('on');b.setAttribute('aria-selected','true');
    document.querySelectorAll('#sv-mine .tabpane').forEach(function(p){p.classList.remove('on');});
    var tp=document.getElementById('tp-'+b.getAttribute('data-tab'));if(tp)tp.classList.add('on');
    if(b.getAttribute('data-tab')==='goals')later(80,animateGoals);
  };
});

/* ============ 数据 ============ */
var MEMS=[
  {k:'休息偏好',kind:'偏好',v:'喜欢安静、人少的地方；对噪音敏感。',m:'3 天前 · 来自对话'},
  {k:'健康习惯',kind:'目标',v:'每晚 23:00 前入睡的目标进行中。',m:'本周 · 来自目标'},
  {k:'旅行偏好',kind:'偏好',v:'偏爱温泉与山野，车程 2 小时内。',m:'2 周前 · 来自对话'},
  {k:'工作节奏',kind:'感知',v:'本周连续加班 4 天，处于疲劳累积期。',m:'昨天 · 来自感知'},
  {k:'妈妈生日',kind:'事件',v:'8 月 24 日，还有 5 天。',m:'上周 · 来自对话'}
];
var GOALS=[
  {n:'周末彻底放松一次',p:60},
  {n:'23:00 前入睡（本周）',p:45},
  {n:'读完《置身事内》第 4 章',p:30}
];
var ARTS=[
  {ico:'🧭',t:'山野温泉两日行程',s:'草案 · 待确认'},
  {ico:'📋',t:'周中减压清单',s:'已完成'},
  {ico:'🗒',t:'睡眠记录 · 本周',s:'进行中'}
];
var SESS=[
  {t:'安排放松的周末',m:'今天 · 6 条消息',x:'进行中',cur:true},
  {t:'周中减压计划',m:'昨天 · 12 条消息',x:'已完成'},
  {t:'睡眠习惯调整',m:'3 天前 · 8 条消息',x:'长期陪伴'},
  {t:'旅行偏好整理',m:'2 周前 · 15 条消息',x:'已完成'}
];

/* 我的：渲染 */
function renderMine(){
  var mg=document.getElementById('memGrid');mg.innerHTML='';
  if(!MEMS.length){mg.innerHTML='<div class="mv-empty">栖光还没有记住什么。对话中它会自己留意。</div>';return;}
  MEMS.forEach(function(m){
    var el=document.createElement('div');el.className='kcard';
    el.innerHTML='<div class="k">'+m.k+'<span class="ktag">'+m.kind+'</span></div><div class="v">'+m.v+'</div><div class="meta">'+m.m+'</div>';
    mg.appendChild(el);
  });
  var ag=document.getElementById('artGrid');ag.innerHTML='';
  if(!ARTS.length){ag.innerHTML='<div class="mv-empty">还没有产物。让栖光帮你规划点什么吧。</div>';return;}
  ARTS.forEach(function(a){
    var el=document.createElement('div');el.className='kcard';
    el.innerHTML='<div class="art-ico" aria-hidden="true">'+a.ico+'</div><div class="v">'+a.t+'</div><div class="meta">'+a.s+'</div>';
    ag.appendChild(el);
  });
}
function renderGoals(){
  var gl=document.getElementById('goalList');gl.innerHTML='';
  if(!GOALS.length){gl.innerHTML='<div class="mv-empty">暂无进行中的目标。</div>';return;}
  GOALS.forEach(function(g){
    var el=document.createElement('div');el.className='goal';
    el.innerHTML='<div class="g-top"><b>'+g.n+'</b><span>'+g.p+'%</span></div><div class="bar"><i data-p="'+g.p+'"></i></div>';
    gl.appendChild(el);
  });
}
function animateGoals(){
  document.querySelectorAll('#goalList .bar i').forEach(function(bar){
    bar.style.width='0%';
    var p=bar.getAttribute('data-p');
    requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.width=p+'%';});});
  });
}

/* 治理：渲染 + 遗忘 */
function renderGov(){
  var box=document.getElementById('govMem');box.innerHTML='';
  if(!MEMS.length){box.innerHTML='<div class="gov-empty">栖光的记忆已清空。它将重新开始认识你。</div>';return;}
  MEMS.forEach(function(m,i){
    var row=document.createElement('div');row.className='gov-row';
    row.innerHTML='<div class="g-main"><b>'+m.k+'</b><div class="g-sub">'+m.v+'</div></div><span class="tag">'+m.m.split(' · ')[0]+'</span><button class="forget" aria-label="遗忘 '+m.k+'">遗忘</button>';
    row.querySelector('.forget').onclick=function(){
      row.classList.add('bye');
      setTimeout(function(){
        MEMS.splice(i,1);renderGov();renderMine();
        if(document.getElementById('sv-home').classList.contains('on')){
          addPerception('🍃','栖光轻轻放下了一段记忆：「'+m.k+'」。');
        }
      },300);
    };
    box.appendChild(row);
  });
}

/* 历史：侧面板视图（与「我的」一致） */
function renderSess(){
  var box=document.getElementById('sessList');box.innerHTML='';
  if(!SESS.length){box.innerHTML='<div class="mv-empty">没有历史会话。和栖光聊点什么，就会有了。</div>';return;}
  SESS.forEach(function(s,i){
    var el=document.createElement('button');el.className='sess'+(s.cur?' cur':'');
    el.innerHTML='<div class="s-t">'+s.t+'</div><div class="s-m">'+s.m+'</div>'+
      '<div class="s-x"><span class="s-tag'+(s.x==='已完成'?' done':'')+'">'+s.x+'</span><span class="s-del" role="button" aria-label="删除会话 '+s.t+'">删除</span></div>';
    el.onclick=function(ev){
      if(ev.target.classList.contains('s-del')){
        ev.stopPropagation();
        el.classList.add('bye');
        setTimeout(function(){SESS.splice(i,1);renderSess();},280);
        return;
      }
      setView('home');
      addPerception('💬','已回到会话「'+s.t+'」，上下文已载入。');
      setMood('listening');
      setTimeout(function(){setMood('calm');},1500);
    };
    box.appendChild(el);
  });
}
document.getElementById('newChat').onclick=function(){setView('home');reset();addPerception('✨','新对话已开启，栖光带着记忆轻装上阵。');inp.focus();};

/* global keys */
addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(cmk.classList.contains('show')){closeCmk();}else{openCmk();}return;}
  if(e.key==='Escape'){
    if(cmk.classList.contains('show')){closeCmk();return;}
    if(human.classList.contains('show')){hideHuman();}
  }
});

/* init */
renderMine();renderGoals();renderGov();renderSess();
layoutOrbit();
setMood('calm');
</script>
