<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>栖光 · 星空背景原型（A/B/C/D 四版可选）</title>
<style>
  :root{
    --brand:#6fd6ff; --brand-soft:rgba(111,214,255,.14); --brand-glow:rgba(111,214,255,.45);
    --gold:#f6c062; --gold-soft:rgba(246,192,98,.14);
    --bg:#050912; --bg2:#0a1120;
    --panel:rgba(18,28,48,.62); --panel-solid:rgba(14,22,40,.86);
    --border:rgba(140,170,220,.16);
    --text:#e8f2ff; --text-2:#a9bdd8; --text-3:#6f829d;
    --radius:18px; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:400 14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ============ 星空层（全部由 canvas 绘制，CSS 只负责底色与暗角） ============ */
  #sky{position:fixed;inset:0;z-index:0;display:block}
  .sky-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(3,6,14,.55) 78%,rgba(3,6,14,.86) 100%)}
  /* 顶部/底部压暗，保证 UI 文字可读 */
  .sky-scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,6,14,.5) 0%,transparent 22%,transparent 72%,rgba(3,6,14,.62) 100%)}

  /* ============ 界面（简化版灵境外壳，用来判断星空"在真实界面里"好不好看） ============ */
  .shell{position:relative;z-index:2;height:100vh;display:flex}
  .rail{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:18px 0 16px;background:var(--panel);backdrop-filter:blur(16px);border-right:1px solid var(--border)}
  .rail-brand{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,#8fe6ff,#3aa6e0);
    box-shadow:0 6px 18px -6px var(--brand-glow);margin-bottom:14px}
  .rail-btn{width:56px;padding:9px 0;border:0;background:transparent;color:var(--text-3);border-radius:12px;
    cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .rail-btn.on{color:var(--brand);background:var(--brand-soft)}
  .rail-btn i{width:16px;height:16px;border:1.6px solid currentColor;border-radius:4px;display:block;opacity:.9}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 22px 18px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .greet h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
  .greet span{font-size:12px;color:var(--text-3)}
  .status{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(12px)}
  .status i{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}

  .stage{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
  .presence{position:relative;border-radius:var(--radius);overflow:hidden;
    background:radial-gradient(60% 60% at 50% 46%,rgba(111,214,255,.13),transparent 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .orb{width:150px;height:158px;border-radius:50%;
    background:radial-gradient(circle at 44% 30%,#fff,#eaf8ff 30%,#bfe8ff 66%,rgba(95,208,255,.34));
    box-shadow:0 0 60px -6px rgba(111,214,255,.5),0 0 0 1px rgba(140,200,255,.22);
    position:relative;animation:breathe 6s var(--ease) infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .orb .eye{position:absolute;top:44%;width:11px;height:14px;border-radius:50%;background:#2b4a68}
  .orb .eye.l{left:31%}.orb .eye.r{right:31%}
  .orb .mouth{position:absolute;top:60%;left:50%;transform:translateX(-50%);
    width:18px;height:9px;border-bottom:2.4px solid #2b4a68;border-radius:0 0 18px 18px}
  .xc-state{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);font-size:12.5px;color:var(--text-2)}
  .xc-state b{color:var(--brand)}
  .xc-caption{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);font-size:11.5px;color:var(--text-3)}

  .chat{display:flex;flex-direction:column;gap:12px;background:var(--panel-solid);backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 60px -30px #000;overflow:hidden;padding:14px}
  .bubble{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.7}
  .bubble.user{align-self:flex-end;background:linear-gradient(140deg,rgba(111,214,255,.9),rgba(58,166,224,.9));color:#04141a}
  .bubble.agent{align-self:flex-start;background:rgba(140,170,220,.1);border:1px solid var(--border);color:var(--text)}
  .composer{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
    background:rgba(140,170,220,.08);border:1px solid var(--border)}
  .composer span{font-size:12.5px;color:var(--text-3)}
  .composer .send{margin-left:auto;width:30px;height:30px;border-radius:10px;background:var(--brand);border:0}

  /* ============ 方案切换台 ============ */
  .lab{position:fixed;right:18px;top:16px;z-index:9;width:262px;padding:13px 14px 14px;
    background:var(--panel-solid);backdrop-filter:blur(18px);border:1px solid var(--border);
    border-radius:16px;box-shadow:0 20px 50px -24px #000;color:var(--text)}
  .lab h3{margin:0 0 3px;font-size:13px;font-weight:650}
  .lab p{margin:0 0 10px;font-size:11px;color:var(--text-3);line-height:1.5}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mode{padding:8px 9px;border-radius:10px;border:1px solid var(--border);background:rgba(140,170,220,.07);
    color:var(--text-2);cursor:pointer;text-align:left;font:inherit}
  .mode b{display:block;font-size:12.5px;color:var(--text)}
  .mode small{font-size:10.5px;color:var(--text-3)}
  .mode.on{border-color:var(--brand);background:var(--brand-soft)}
  .mode.on b{color:var(--brand)}
  .lab-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--text-2)}
  .lab-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .fps{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:11px}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;font-size:11px;color:var(--text-3);
    background:var(--panel-solid);border:1px solid var(--border);padding:6px 14px;border-radius:999px;backdrop-filter:blur(10px)}
  @media (max-width:980px){
    .stage{grid-template-columns:1fr;grid-template-rows:minmax(240px,42vh) minmax(0,1fr)}
    .lab{right:10px;top:10px;width:224px}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="sky-vignette"></div>
<div class="sky-scrim"></div>

<div class="shell">
  <aside class="rail">
    <div class="rail-brand"></div>
    <button class="rail-btn on"><i></i>此刻</button>
    <button class="rail-btn"><i></i>我的</button>
    <button class="rail-btn"><i></i>治理</button>
    <div class="rail-foot">
      <button class="rail-btn"><i></i>青蓝</button>
      <button class="rail-btn"><i></i>精简</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="greet"><h1>晚上好</h1><span>此刻 · 星空背景原型</span></div>
      <div class="status"><i></i>在线</div>
    </div>
    <div class="stage">
      <section class="presence">
        <div class="orb"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div>
        <div class="xc-state">栖光 · <b>静候</b></div>
        <div class="xc-caption">今天想先做点什么？我在。</div>
      </section>
      <section class="chat">
        <div class="bubble user">帮我规划这周末的杭州短途游</div>
        <div class="bubble agent">收到～我先拆解任务，再检索天气与景点资料。</div>
        <div class="bubble agent">方案已经整理好了，要不要我顺手设个提醒？</div>
        <div class="composer"><span>有什么想交给栖光的？</span><button class="send"></button></div>
      </section>
    </div>
  </div>
</div>

<div class="lab">
  <h3>星空方案 · 四选一</h3>
  <p>按 <b>1–4</b> 快速切换。都在真实界面里渲染，判断"炫不炫"也判断"会不会抢戏"。</p>
  <div class="modes">
    <button class="mode on" data-mode="serene"><b>A 静谧深空</b><small>三层视差 · 呼吸闪烁</small></button>
    <button class="mode" data-mode="galaxy"><b>B 银河旋涡</b><small>银河带 · 星云尘</small></button>
    <button class="mode" data-mode="orbit"><b>C 星轨流转</b><small>绕心缓转 · 强纵深</small></button>
    <button class="mode" data-mode="aurora"><b>D 极光夜空</b><small>极光飘带 + 星</small></button>
  </div>
  <div class="lab-row">
    <label><input type="checkbox" id="shoot" checked /> 流星</label>
    <label><input type="checkbox" id="lite" /> 精简(降密度)</label>
    <span class="fps" id="fps">-- fps</span>
  </div>
  <div class="lab-row">
    <label><input type="radio" name="acc" value="nebula" checked /> 青蓝</label>
    <label><input type="radio" name="acc" value="warm" /> 暖金</label>
  </div>
</div>
<div class="hint">配色纪律：冰青 = 系统语言；暖金只留给「人的环」。星空不抢戏，只做底。</div>

<script>
(() => {
  'use strict';
  const cvs = document.getElementById('sky');
  const ctx = cvs.getContext('2d', { alpha: true });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PAL = {
    nebula: { far: '150,180,235', near: '205,232,255', hot: '111,214,255', band: '111,214,255', aur1: '94,242,255', aur2: '122,240,212' },
    warm:   { far: '236,206,168', near: '255,232,200', hot: '246,192,98',  band: '246,192,98',  aur1: '255,200,120', aur2: '255,170,100' },
  };

  let mode = 'serene';
  let accent = 'nebula';
  let lite = false;
  let shooting = true;

  let W = 0, H = 0, DPR = 1;
  let stars = [], dust = [], shoots = [];
  let raf = 0, paused = false, t0 = performance.now();
  let lastShoot = 0;
  let frames = 0, fpsT = performance.now();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function buildStars() {
    const base = clamp(Math.round((W * H) / 6200), 120, lite ? 200 : 460);
    stars = [];
    for (let i = 0; i < base; i++) {
      const depth = Math.random();
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.35 + depth * 1.6,
        a: 0.16 + depth * 0.62,
        s: (0.005 + depth * 0.026) * (Math.random() > .5 ? 1 : .6),
        sway: Math.random() * Math.PI * 2,
        tw: Math.random() * Math.PI * 2,
        tws: rnd(0.0006, 0.0022),
        depth,
        // C 星轨：极坐标（绕画面中心）
        ang: Math.random() * Math.PI * 2,
        rad: rnd(0.08, 1.05) * Math.hypot(W, H) * 0.5,
        spin: rnd(0.00004, 0.00022) * (Math.random() > .5 ? 1 : -1),
      });
    }
    // B 银河：沿一条斜带聚集的尘埃星屑
    const dustN = lite ? 220 : 640;
    dust = [];
    const cx = W * 0.5, cy = H * 0.46, L = Math.hypot(W, H);
    const tilt = -0.32; // 弧度，斜向
    for (let i = 0; i < dustN; i++) {
      const u = rnd(-0.55, 0.55) * L;                 // 沿带方向
      const g = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; // 近似正态
      const v = g * L * 0.085;                        // 垂直带方向
      dust.push({
        x: cx + u * Math.cos(tilt) - v * Math.sin(tilt),
        y: cy + u * Math.sin(tilt) + v * Math.cos(tilt),
        r: rnd(0.3, 0.95),
        a: rnd(0.12, 0.55) * (1 - Math.abs(g) * 0.55),
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }

  /* ---------- B 银河带：一条斜向的发光带 + 尘带里的暗纹 ---------- */
  function drawGalaxy(p, t) {
    const cx = W * 0.5, cy = H * 0.46, L = Math.hypot(W, H) * 1.25, thick = H * 0.34;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-0.32);
    const g = ctx.createLinearGradient(0, -thick / 2, 0, thick / 2);
    g.addColorStop(0, `rgba(${p.band},0)`);
    g.addColorStop(0.34, `rgba(${p.band},0.075)`);
    g.addColorStop(0.5, `rgba(${p.band},0.16)`);
    g.addColorStop(0.66, `rgba(${p.band},0.075)`);
    g.addColorStop(1, `rgba(${p.band},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(-L / 2, -thick / 2, L, thick);
    // 尘带暗纹（让银河有"质感"，不是一条纯光带）
    ctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 5; i++) {
      const off = (i / 4 - 0.5) * thick * 0.62;
      const wob = Math.sin(t * 0.00012 + i) * thick * 0.05;
      const dg = ctx.createLinearGradient(0, off + wob - thick * 0.05, 0, off + wob + thick * 0.05);
      dg.addColorStop(0, 'rgba(0,0,0,0)');
      dg.addColorStop(0.5, 'rgba(0,0,0,0.42)');
      dg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = dg;
      ctx.fillRect(-L / 2, off + wob - thick * 0.05, L, thick * 0.1);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // 尘埃星屑
    for (const d of dust) {
      const tw = 0.72 + 0.28 * Math.sin(t * 0.0012 + d.tw);
      ctx.fillStyle = `rgba(${p.near},${(d.a * tw).toFixed(3)})`;
      ctx.fillRect(d.x, d.y, d.r, d.r);
    }
  }

  /* ---------- D 极光飘带 ----------
     性能要点：绝不用 ctx.filter='blur(18px)' —— 大面填充 + blur 会把帧率砍半（实测 30→15fps）。
     改为「1/6 分辨率离屏画布绘制 + 放大回主画布」，靠双线性插值天然柔化，成本几乎为零。 */
  let aurCvs = null, aurCtx = null;
  function drawAurora(p, t) {
    const s = lite ? 8 : 6;
    if (!aurCvs) { aurCvs = document.createElement('canvas'); aurCtx = aurCvs.getContext('2d'); }
    const aw = Math.max(48, Math.round(W / s));
    const ah = Math.max(32, Math.round(H / s));
    if (aurCvs.width !== aw || aurCvs.height !== ah) { aurCvs.width = aw; aurCvs.height = ah; }
    const a = aurCtx;
    a.clearRect(0, 0, aw, ah);
    const bands = lite ? 2 : 3;
    for (let b = 0; b < bands; b++) {
      const yBase = ah * (0.16 + b * 0.13);
      const amp = ah * (0.05 + b * 0.02);
      const col = b % 2 === 0 ? p.aur1 : p.aur2;
      const g = a.createLinearGradient(0, yBase - amp * 1.6, 0, yBase + amp * 2.6);
      g.addColorStop(0, `rgba(${col},0)`);
      g.addColorStop(0.42, `rgba(${col},${0.15 - b * 0.03})`);
      g.addColorStop(1, `rgba(${col},0)`);
      a.fillStyle = g;
      a.beginPath();
      a.moveTo(-4, yBase);
      const step = Math.max(6, aw / 22);
      for (let x = -4; x <= aw + 4; x += step) {
        const yy = yBase + Math.sin(x * 0.0032 * s + t * 0.00042 + b * 1.7) * amp
                          + Math.sin(x * 0.0011 * s - t * 0.00027 + b) * amp * 0.55;
        a.lineTo(x, yy);
      }
      a.lineTo(aw + 4, yBase + amp * 2.8);
      a.lineTo(-4, yBase + amp * 2.8);
      a.closePath();
      a.fill();
    }
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(aurCvs, 0, 0, W, H);
    ctx.restore();
  }

  /* ---------- 流星 ---------- */
  function maybeShoot(t) {
    if (!shooting || reduce || lite) return;
    if (t - lastShoot < 4200 + Math.random() * 6000) return;
    lastShoot = t;
    const fromLeft = Math.random() > 0.35;
    const sp = rnd(0.55, 0.95);
    shoots.push({
      x: fromLeft ? rnd(-0.1, 0.5) * W : rnd(0.5, 1.1) * W,
      y: rnd(-0.05, 0.4) * H,
      vx: (fromLeft ? 1 : -1) * rnd(6, 10) * sp,
      vy: rnd(3.2, 5.6) * sp,
      life: 0, max: rnd(620, 980),
      len: rnd(90, 190),
    });
  }
  function drawShoots(dt) {
    for (let i = shoots.length - 1; i >= 0; i--) {
      const s = shoots[i];
      s.life += dt;
      const k = s.life / s.max;
      if (k >= 1) { shoots.splice(i, 1); continue; }
      s.x += s.vx * dt * 0.06; s.y += s.vy * dt * 0.06;
      const fade = Math.sin(Math.PI * k); // 头尾淡入淡出
      const n = Math.hypot(s.vx, s.vy) || 1;
      const tx = s.x - (s.vx / n) * s.len;
      const ty = s.y - (s.vy / n) * s.len;
      const p = PAL[accent];
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${(0.9 * fade).toFixed(3)})`);
      g.addColorStop(0.28, `rgba(${p.hot},${(0.55 * fade).toFixed(3)})`);
      g.addColorStop(1, `rgba(${p.hot},0)`);
      ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.7, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${(0.95 * fade).toFixed(3)})`; ctx.fill();
    }
  }

  /* ---------- 主渲染 ---------- */
  let prev = performance.now();
  function render(t) {
    const dt = Math.min(48, t - prev); prev = t;
    const p = PAL[accent];
    ctx.clearRect(0, 0, W, H);

    if (mode === 'galaxy') drawGalaxy(p, t);
    if (mode === 'aurora') drawAurora(p, t);

    const cx = W * 0.5, cy = H * 0.46;
    for (const s of stars) {
      let x = s.x, y = s.y;
      if (!reduce) {
        if (mode === 'orbit') {
          s.ang += s.spin * dt;
          x = cx + Math.cos(s.ang) * s.rad;
          y = cy + Math.sin(s.ang) * s.rad * 0.72;
        } else {
          y -= s.s * dt * 0.06;
          x += Math.sin(t * 0.0004 + s.sway) * 0.12 * s.depth;
          if (y < -2) { s.y = H + 2; s.x = Math.random() * W; continue; }
          s.y = y; s.x = x;
        }
      }
      if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
      const tw = reduce ? 1 : 0.68 + 0.32 * Math.sin(t * s.tws + s.tw);
      const a = s.a * tw * (mode === 'orbit' ? 0.9 : 1);
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.depth > 0.6 ? p.near : p.far},${a.toFixed(3)})`;
      ctx.fill();
      // 亮星加一点光晕（只给最近的少数，避免满屏发光）
      if (s.depth > 0.93 && !lite) {
        ctx.beginPath();
        ctx.arc(x, y, s.r * 3.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.hot},${(0.09 * tw).toFixed(3)})`;
        ctx.fill();
      }
    }

    maybeShoot(t);
    drawShoots(dt);

    // fps
    frames++;
    if (t - fpsT > 500) {
      document.getElementById('fps').textContent = Math.round((frames * 1000) / (t - fpsT)) + ' fps';
      frames = 0; fpsT = t;
    }
  }

  function loop(t) { if (paused) return; render(t); raf = requestAnimationFrame(loop); }
  function start() { if (reduce) { render(t0); return; } prev = performance.now(); raf = requestAnimationFrame(loop); }
  function stop() { cancelAnimationFrame(raf); }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { paused = true; stop(); }
    else if (paused) { paused = false; lastShoot = performance.now(); start(); }
  });

  /* ---------- 控件 ---------- */
  const btns = [...document.querySelectorAll('.mode')];
  function setMode(m) {
    mode = m;
    btns.forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
    shoots.length = 0;
    if (reduce) render(performance.now());
  }
  btns.forEach((b, i) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  window.addEventListener('keydown', (e) => {
    const order = ['serene', 'galaxy', 'orbit', 'aurora'];
    const n = Number(e.key);
    if (n >= 1 && n <= 4) setMode(order[n - 1]);
  });
  document.getElementById('shoot').addEventListener('change', (e) => { shooting = e.target.checked; });
  document.getElementById('lite').addEventListener('change', (e) => { lite = e.target.checked; buildStars(); });
  document.querySelectorAll('input[name="acc"]').forEach((r) =>
    r.addEventListener('change', () => { accent = r.value; }));

  window.addEventListener('resize', () => { resize(); if (reduce) render(performance.now()); });
  resize();
  start();
})();
</script>
</body>
</html>
