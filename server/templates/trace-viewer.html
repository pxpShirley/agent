<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星澜 · 对话轮回放 (trace)</title>
<style>
  :root {
    --bg: #0c1118;
    --panel: #131b26;
    --panel-2: #18222f;
    --border: #243243;
    --text: #d7e2ee;
    --muted: #7c8da0;
    --core: #6fd6ff;     /* 冰青：系统/工具 */
    --gold: #f6c062;     /* 暖金：人的环 / 需要你 */
    --blue: #5b9dff;
    --green: #5fd39a;
    --red: #ff7a7a;
    --purple: #b69cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #16202d, #0e151e);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex: none;
  }
  header h1 { font-size: 16px; margin: 0; color: var(--core); letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .badge {
    margin-left: auto; font-size: 11px; color: var(--gold);
    border: 1px solid var(--gold); border-radius: 999px; padding: 2px 10px; opacity: .85;
  }
  main { flex: 1; display: flex; min-height: 0; }
  /* 左：runs 列表 */
  .runs {
    width: 340px; flex: none; border-right: 1px solid var(--border);
    overflow-y: auto; background: var(--panel);
  }
  .runs h2, .trace h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 0; padding: 12px 16px; position: sticky; top: 0;
    background: var(--panel); border-bottom: 1px solid var(--border); z-index: 1;
  }
  .run-item {
    padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .12s;
  }
  .run-item:hover { background: var(--panel-2); }
  .run-item.active { background: #1c2a3a; box-shadow: inset 3px 0 0 var(--core); }
  .run-item .prompt {
    color: var(--text); font-size: 13px; margin-bottom: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .run-item .meta { color: var(--muted); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
  .run-item .meta b { color: var(--core); font-weight: 600; }
  .empty { color: var(--muted); padding: 24px 16px; font-size: 13px; }
  /* 右：trace 时间线 */
  .trace { flex: 1; overflow-y: auto; padding: 0 0 40px; }
  .run-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .run-head .row { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .run-head .row b { color: var(--text); font-weight: 600; }
  .run-head .fullprompt { color: var(--text); font-size: 13px; margin-top: 8px; }
  .timeline { padding: 14px 18px; }
  .span {
    display: grid; grid-template-columns: 64px 1fr; gap: 12px;
    padding: 10px 0; border-bottom: 1px dashed var(--border);
  }
  .span .seq {
    color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
    text-align: right; padding-top: 2px;
  }
  .span .body { min-width: 0; }
  .phase {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 9px; border-radius: 6px; color: #0c1118; text-transform: uppercase;
  }
  .phase.think { background: var(--core); }
  .phase.tool_call { background: var(--blue); }
  .phase.tool_result { background: var(--green); }
  .phase.ask_user { background: var(--gold); }
  .phase.error { background: var(--red); }
  .phase.intent { background: var(--purple); }
  .span .tool { color: var(--text); font-weight: 600; margin-left: 8px; }
  .span .content {
    margin-top: 6px; color: var(--text); font-size: 13px; white-space: pre-wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; max-height: 220px; overflow: auto;
  }
  .span .content.empty { display: none; }
  .span .label { color: var(--muted); font-size: 11px; margin-top: 5px; }
  .err-banner {
    margin: 14px 18px; padding: 10px 14px; border-radius: 8px;
    background: rgba(255,122,122,.12); border: 1px solid var(--red); color: var(--red); font-size: 13px;
  }
  .loading { color: var(--muted); padding: 24px 18px; }
</style>
</head>
<body>
  <header>
    <h1>星澜 · 对话轮回放</h1>
    <span class="sub">只读 trace 视图 — 还原每次轮的工具调用 / 思考 / 人在环</span>
    <span class="badge">READ-ONLY</span>
  </header>
  <main>
    <section class="runs">
      <h2>最近的对话轮</h2>
      <div id="runList"><div class="empty">加载中…</div></div>
    </section>
    <section class="trace">
      <h2>回放时间线</h2>
      <div id="traceView"><div class="empty">从左侧选择一轮查看回放</div></div>
    </section>
  </main>

<script>
(function () {
  // admin 鉴权（若服务端启用了 ADMIN_TOKEN）：从 URL ?token= 读取并附到请求
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const qs = token ? '?token=' + encodeURIComponent(token) : '';

  const $ = (sel) => document.querySelector(sel);
  const runList = $('#runList');
  const traceView = $('#traceView');
  let selectedId = null;

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  async function loadRuns() {
    runList.innerHTML = '<div class="empty">加载中…</div>';
    try {
      const res = await fetch('/api/admin/runs' + qs);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const runs = (data.runs || []).filter((r) => r.id);
      if (!runs.length) {
        runList.innerHTML = '<div class="empty">暂无对话轮记录</div>';
        return;
      }
      runList.innerHTML = '';
      for (const r of runs) {
        const el = document.createElement('div');
        el.className = 'run-item' + (r.id === selectedId ? ' active' : '');
        el.dataset.id = r.id;
        const prompt = (r.prompt || '').slice(0, 60) || '（无 prompt）';
        const its = r.iterations != null ? r.iterations : '-';
        const tools = r.tool_calls_count != null ? r.tool_calls_count : '-';
        const ms = r.latency_ms != null ? (r.latency_ms + 'ms') : '-';
        el.innerHTML =
          '<div class="prompt">' + esc(prompt) + '</div>' +
          '<div class="meta">' +
            '<span><b>' + esc(r.model || '?') + '</b></span>' +
            '<span>intent: ' + esc(r.intent || '-') + '</span>' +
            '<span>轮次 ' + its + '</span>' +
            '<span>工具 ' + tools + '</span>' +
            '<span>' + ms + '</span>' +
            '<span>' + esc(fmtTime(r.created_at)) + '</span>' +
          '</div>';
        el.addEventListener('click', () => selectRun(r.id));
        runList.appendChild(el);
      }
    } catch (e) {
      runList.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    }
  }

  async function selectRun(id) {
    selectedId = id;
    document.querySelectorAll('.run-item').forEach((n) => {
      n.classList.toggle('active', n.dataset.id === id);
    });
    traceView.innerHTML = '<div class="loading">回放加载中…</div>';
    try {
      const res = await fetch('/api/admin/runs/' + encodeURIComponent(id) + '/trace' + qs);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.run) throw new Error('运行记录不存在');
      renderTrace(data.run, data.spans || []);
    } catch (e) {
      traceView.innerHTML = '<div class="err-banner">回放加载失败：' + esc(e.message) + '</div>';
    }
  }

  function renderTrace(run, spans) {
    let html = '';
    html += '<div class="run-head">';
    html += '<div class="fullprompt">「' + esc(run.prompt || '') + '」</div>';
    html += '<div class="row">';
    html += '<span>模型 <b>' + esc(run.model || '-') + '</b></span>';
    html += '<span>意图 <b>' + esc(run.intent || '-') + '</b></span>';
    html += '<span>轮次 <b>' + esc(run.iterations != null ? run.iterations : '-') + '</b></span>';
    html += '<span>工具调用 <b>' + esc(run.tool_calls_count != null ? run.tool_calls_count : '-') + '</b></span>';
    html += '<span>并发轮 <b>' + esc(run.parallel_rounds != null ? run.parallel_rounds : '-') + '</b></span>';
    html += '<span>耗时 <b>' + esc(run.latency_ms != null ? run.latency_ms + 'ms' : '-') + '</b></span>';
    html += '<span>工具集 <b>' + esc(run.tools_used || '-') + '</b></span>';
    html += '</div></div>';

    if (!spans.length) {
      html += '<div class="empty" style="padding:24px 18px">该轮没有 span 记录（可能是 skipRecord 或旧版本写入）。</div>';
    } else {
      html += '<div class="timeline">';
      for (const s of spans) {
        html += '<div class="span">';
        html += '<div class="seq">#' + esc(s.seq) + '</div>';
        html += '<div class="body">';
        html += '<span class="phase ' + esc(s.phase) + '">' + esc(s.phase) + '</span>';
        if (s.tool) html += '<span class="tool">' + esc(s.tool) + '</span>';
        // 可见文本（think / ask_user / error / intent）
        if (s.text) {
          html += '<div class="content">' + esc(s.text) + '</div>';
        } else if (s.args_json) {
          html += '<div class="label">入参</div><div class="content">' + esc(s.args_json) + '</div>';
        } else if (s.result_json) {
          html += '<div class="label">返回</div><div class="content">' + esc(s.result_json) + '</div>';
        }
        html += '</div></div>';
      }
      html += '</div>';
    }
    traceView.innerHTML = html;
  }

  loadRuns();
})();
</script>
</body>
</html>
